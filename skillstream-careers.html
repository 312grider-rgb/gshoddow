<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/i18n.js?v=1"></script>
<link href="css/rtl.css?v=2" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers — Paradise Of The Eternal Learners</title>
<style>
  :root{ --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --cream:#FBF7EF; --line:#E9E2D2; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--cream);color:#2B2B2B;padding-bottom:90px}
  header.top{background:linear-gradient(160deg,var(--ink),var(--ink-2));color:var(--cream);padding:22px 18px 24px}
  header.top .eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;font-weight:700}
  header.top h1{margin:0;font-size:24px;color:var(--cream)}
  header.top p{margin:8px 0 0;font-size:14px;color:rgba(251,247,239,.85);line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px 18px}
  .warn{background:#FFF3D6;border:1.5px solid #E8CF8C;border-radius:14px;padding:12px;font-size:14px;line-height:1.55;color:#5E4A12;margin:0 0 14px}
  details.prep{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px}
  details.prep summary{font-weight:800;color:var(--ink);font-size:15px;cursor:pointer}
  details.prep ol{margin:10px 0 0;padding-inline-start:20px;font-size:14.5px;line-height:1.6}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:700 14px Inter,sans-serif;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 6px 14px -10px rgba(20,31,56,.3)}
  .ct{font-size:16px;font-weight:800;color:var(--ink);line-height:1.3}
  .row{font-size:14.5px;line-height:1.55;margin-top:8px}
  .lbl{font-size:12.5px;font-weight:800;color:#8A6A1F;margin-top:10px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btns a{padding:9px 14px;border-radius:999px;border:1.5px solid var(--gold);background:#FFF9EC;color:#8A6A1F;font:700 13px Inter,sans-serif;text-decoration:none}
  .btns a.main{background:var(--ink);border-color:var(--ink);color:#fff}
  .sec{font-size:12.5px;font-weight:800;color:#8A6A1F;margin-top:10px}
  .foot{font-size:12.5px;color:#6B6558;line-height:1.55;margin:16px 0}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>Careers</h1>
  <p>What each subject can lead to, and which jobs are growing in the future.</p>
</header>
<div class="wrap">
  <div class="warn">Nobody can predict jobs exactly. This is a guide based on trends, not a promise. Skills usually last longer than job titles.</div>
  <div class="chips" id="tabs"><button type="button" class="chip on" data-t="sub">By subject</button><button type="button" class="chip" data-t="fut">Jobs of the future</button></div>
  <div id="list"></div>
  <div class="foot"><a href="skillstream-jobs.html" style="color:#8A6A1F">See jobs now</a> · <a href="skillstream-scholarships.html" style="color:#8A6A1F">Scholarships to study</a></div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var SUB=[{"n": "Science", "c": "Researcher, laboratory scientist, doctor or pharmacist (with further study), environmental scientist, science teacher, data scientist.", "s": "Careful observation, running experiments, thinking with evidence.", "a": "AI helps to analyse data and suggest experiments. People still choose which questions matter and check the results."}, {"n": "Mathematics", "c": "Engineer, statistician, data analyst, actuary, economist, software developer, teacher.", "s": "Logic, modelling real problems, solving problems step by step.", "a": "Tools do routine calculations. People who can build a model and check an answer stay valuable."}, {"n": "Technology", "c": "Software developer, cybersecurity analyst, network engineer, IT support, web designer, electronics technician.", "s": "Building and fixing systems, debugging, understanding how things connect.", "a": "AI assistants now write part of the code. Understanding design, security and testing still matters a lot."}, {"n": "Artificial Intelligence", "c": "AI engineer, data scientist, AI product designer, AI ethics and safety specialist, data and model quality checker.", "s": "Programming, statistics, working with data, careful judgement.", "a": "The field changes very fast. The basics (maths, programming, statistics) last longer than any single tool."}, {"n": "Business", "c": "Manager, accountant, marketer, sales and customer roles, HR, operations, project manager.", "s": "Planning, communication, understanding numbers, leading people.", "a": "Routine reports and drafts are being automated. Judgement, trust and leading teams grow in value."}, {"n": "Economics", "c": "Economist, financial analyst, banker, policy adviser, market researcher, development and aid work.", "s": "Reading data, understanding markets, explaining trade-offs clearly.", "a": "Data work is getting faster. The ability to interpret results and explain them to others remains important."}, {"n": "Entrepreneurship", "c": "Starting your own business, freelancer, product manager, social entrepreneur.", "s": "Spotting problems, selling an idea, managing money, not giving up.", "a": "It is cheaper to start with AI tools, so more people compete. Real customer problems and trust make the difference."}, {"n": "Psychology", "c": "Counsellor or therapist (needs training and a licence), social worker, teacher, HR specialist, user researcher, coach.", "s": "Listening, understanding behaviour, research methods, empathy.", "a": "AI can support people, but trust and human care are hard to replace."}, {"n": "Philosophy", "c": "Lawyer (with a law degree), policy adviser, ethics specialist, writer, journalist, teacher.", "s": "Clear arguments, asking good questions, thinking about right and wrong.", "a": "AI ethics and rules are a growing area that needs people who can reason carefully."}, {"n": "Languages", "c": "Translator, interpreter, teacher, diplomat, international business, tourism, content creator.", "s": "Speaking and writing well, understanding other cultures.", "a": "Machines handle simple translation. People are still needed for meaning, culture, live interpreting and quality checks."}, {"n": "Arts", "c": "Designer, animator, architect, writer, musician, game artist, creative roles in marketing.", "s": "Creativity, taste, telling a story, finishing a project.", "a": "AI can make quick drafts. Original ideas, taste and a personal style help your work stand out."}];
  var FUT=[{"i": "ai", "n": "AI", "g": "AI engineers, data specialists, AI safety and security specialists, people who check and improve AI results.", "h": "Routine office work, basic customer service and simple coding tasks may change the most.", "k": "Maths and statistics, programming basics, asking good questions, checking sources."}, {"i": "health", "n": "Health", "g": "Nurses and care workers, bioinformatics and health-data specialists, medical device technicians, genetic counsellors.", "h": "Routine lab and scan reading may be shared with AI tools. Care that needs a person stays central.", "k": "Biology, data skills, communication, ethics."}, {"i": "energy", "n": "Energy", "g": "Solar and battery technicians, electricians, grid engineers, energy-efficiency specialists.", "h": "Some fuel-related jobs may shrink in places that change their energy sources.", "k": "Electrical basics, maths, practical project skills."}, {"i": "space", "n": "Space", "g": "Aerospace engineers, satellite data analysts, mission operations, advanced manufacturing technicians.", "h": "Parts of manufacturing and launch work may become more automated.", "k": "Physics, programming, teamwork, careful testing."}, {"i": "computing", "n": "Computing", "g": "Cybersecurity specialists, cloud engineers, software developers. Quantum computing jobs exist but are few and need advanced degrees.", "h": "Basic coding and routine IT tasks may be shared with AI tools.", "k": "Maths, programming, security basics, learning new tools quickly."}, {"i": "finance", "n": "Finance and economy", "g": "Financial technology developers, risk and compliance staff, mobile-money product roles, data analysts, financial advisers.", "h": "Routine bookkeeping and clerical work may change the most.", "k": "Numbers, data skills, understanding rules, building trust."}, {"i": "transport", "n": "Transport", "g": "Electric-vehicle technicians, charging-network workers, logistics planners, drone operators.", "h": "Driving jobs may change over time, but the speed is uncertain and differs by country.", "k": "Mechanics and electronics, planning, data, safety rules."}];
  var tab='sub';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function draw(){
    if(tab==='sub'){
      $('list').innerHTML=SUB.map(function(c){
        return '<div class="card"><div class="ct">'+esc(c.n)+'</div>'
          +'<div class="sec">Careers it can lead to</div><div class="row" style="margin-top:2px">'+esc(c.c)+'</div>'
          +'<div class="sec">Skills you build</div><div class="row" style="margin-top:2px">'+esc(c.s)+'</div>'
          +'<div class="sec">How AI is changing it</div><div class="row" style="margin-top:2px">'+esc(c.a)+'</div>'
          +'<div class="btns"><a class="main" href="skillstream-discover.html?w='+encodeURIComponent(c.n)+'">Learn this</a>'
          +'<a href="skillstream-ai-hub.html?tab=teacher&q='+encodeURIComponent('What careers can I get by studying '+c.n+'? What should I learn first?')+'">Ask the AI Teacher</a></div></div>';
      }).join('');
    }else{
      $('list').innerHTML=FUT.map(function(c){
        return '<div class="card"><div class="ct">'+esc(c.n)+'</div>'
          +'<div class="sec">Roles that may grow</div><div class="row" style="margin-top:2px">'+esc(c.g)+'</div>'
          +'<div class="sec">Roles that may change</div><div class="row" style="margin-top:2px">'+esc(c.h)+'</div>'
          +'<div class="sec">Skills to learn now</div><div class="row" style="margin-top:2px">'+esc(c.k)+'</div>'
          +'<div class="btns"><a class="main" href="skillstream-edge.html?i='+c.i+'">See what is new</a>'
          +'<a href="skillstream-ai-hub.html?tab=teacher&q='+encodeURIComponent('What jobs may grow in '+c.n+' and what should I study to prepare?')+'">Ask the AI Teacher</a></div></div>';
      }).join('');
    }
  }
  Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){tab=b.getAttribute('data-t');Array.prototype.forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});draw()}});
  draw();
})();
</script>
<script src="js/nav.js" defer></script>
</body>
</html>
