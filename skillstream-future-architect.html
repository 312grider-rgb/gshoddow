<style>

/* Layout: a route map. The five activities are stations on one loop; every view returns to it.
   Colours come from css/theme.css (ink, gold, cream, sage). Dark mode follows the app's 'theme' setting. */
:root{
  --bg:var(--cream);--surface:#FFFFFF;--raised:#FDFCFA;--muted:#6B6558;--line-soft:#F1EBDD;
  --accent:#141F38;--on-accent:#FFFFFF;--accent-soft:#F3ECDA;--focus:#C9A24E;--gold-text:#8A6A1F;--link:#1F2E52;
  --fast:#4F7556;--fast-soft:#E3EFE5;--steady:#8A6A1F;--steady-soft:#F6ECD2;--bumpy:#A8472F;--bumpy-soft:#F7E1DA;
  --fact:#141F38;--on-fact:#FBF7EF;
  --font-display:'Syne','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'Inter','Segoe UI',system-ui,sans-serif;
  --r:12px;
}
html[data-theme="dark"]{
  --ink:#EDE9DD;--ink-2:#F5F1E6;--gold:#D9B366;--gold-light:#E9CD8F;--cream:#12172A;--sage:#7FAF88;--charcoal:#EDE9DD;--line:#2A3350;--paper:#232B47;
  --surface:#1B2138;--raised:#222A45;--muted:#A9A89F;--line-soft:#232B47;
  --accent:#E4C583;--on-accent:#141F38;--accent-soft:#2A3350;--focus:#E4C583;--gold-text:#E4C583;--link:#E4C583;
  --fast:#8CC9A0;--fast-soft:#1F3A2B;--steady:#E4C583;--steady-soft:#3A3014;--bumpy:#F0917A;--bumpy-soft:#41211B;
  --fact:#EDE9DD;--on-fact:#12172A;
  color-scheme:dark;
}
header.top{background:linear-gradient(160deg,#141F38 0%,#1F2E52 100%);color:#FBF7EF;padding:26px 20px 28px}
header.top .eyebrow{color:#E4C583;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;margin-bottom:6px}
header.top h1{margin:0;font-size:30px;font-weight:700;color:#FBF7EF}
header.top p{margin:8px 0 0;font-size:15px;opacity:.85;max-width:60ch}
header.top .banner-link{display:inline-block;margin-top:14px;color:#E4C583;font-weight:600;font-size:14px}
*{box-sizing:border-box}
body{margin:0;padding-bottom:40px;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
#app{max-width:1120px;margin-inline:auto;padding:20px 20px 0}
.loading{padding:40px 0}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.012em}
.h3{font-size:1.3rem;font-weight:800}.h4{font-size:1rem;font-weight:800}
p,ul,ol{margin:0}
ul,ol{padding-inline-start:1.1rem}
.mono{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.02em}
.dim,.hint{color:var(--muted)}.hint{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.5rem .95rem;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:var(--r);font-weight:600;font-size:.92rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:36px;padding:.3rem .7rem;font-size:.82rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:6px 0;color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* header */
.fa-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:start}
.brand span{display:grid;line-height:1.1}.brand strong{font:800 1.1rem var(--font-display)}.brand small{color:var(--muted)}
.levels{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.lv{min-height:40px;padding:.3rem .8rem;border:1px solid var(--line);background:var(--raised);border-radius:999px;font-size:.85rem;font-weight:600}
.lv[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.save{color:var(--muted);flex-basis:100%}
@media(min-width:760px){.save{flex-basis:auto}}

/* hero */
.hero{display:grid;gap:24px;padding-block:8px 24px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:minmax(0,1fr) 260px}}
.eyebrow{color:var(--gold-text);margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
.hero-h{font-size:clamp(1.9rem,5.5vw,3.1rem);font-weight:800;max-width:19ch}
.lede{margin-top:14px;max-width:62ch;color:var(--muted);font-size:1.05rem}
.lede.small{font-size:1rem;margin-top:8px}
.hero svg{width:100%;max-width:260px;justify-self:end;color:var(--muted)}
.projbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:22px}
.projbar .field{flex:1 1 260px}
.note{margin-top:12px;color:var(--muted);font-size:.9rem}

/* route */
h2.sec{font-size:1.5rem;font-weight:800;margin-block:28px 14px}
.route{position:relative;display:grid;gap:12px;padding-inline-start:44px;margin:0;list-style:none}
.route::before{content:"";position:absolute;inset-block:18px;inset-inline-start:15px;border-inline-start:2px dashed var(--line)}
.stop{position:relative;list-style:none}
.badge{position:absolute;inset-inline-start:-44px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.stop-btn{display:grid;gap:8px;width:100%;height:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stop-btn:hover{border-color:var(--gold)}
.stop-btn h3{font-size:1.1rem;font-weight:800}.stop-btn p{color:var(--muted);font-size:.9rem}
.bar{display:block;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.loop{margin-top:12px;color:var(--muted)}
@media(min-width:1000px){
  .route{grid-template-columns:repeat(5,minmax(0,1fr));padding-inline-start:0;padding-top:44px}
  .route::before{inset-block:auto;inset-inline:16px;top:15px;border-inline-start:0;border-top:2px dashed var(--line)}
  .badge{inset-inline-start:12px;top:-44px}
}
@media(prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}

/* cards and dashboard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.two{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:28px}
.plist{list-style:none;padding:0;display:grid;gap:8px}
.prow{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.prow.on{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.pmeta{display:grid;gap:2px;min-width:0}.pmeta strong{overflow-wrap:anywhere}
.pact{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.meter{display:grid;gap:4px}.meter .row{display:flex;justify-content:space-between;gap:8px}
.meter small{color:var(--muted)}
.qcard{margin-top:28px;border-inline-start:4px solid var(--gold);padding:6px 0 6px 16px;display:grid;gap:10px;justify-items:start}
.qcard p.q{font:700 1.35rem/1.25 var(--font-display);max-width:46ch}

/* section view */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding-top:14px}
.crumb{color:var(--muted);overflow-wrap:anywhere}
.sec-title{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:800;margin-top:6px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.sec-title .n{color:var(--gold-text)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-block:18px}
.step{min-height:40px;padding:.25rem .8rem;border:1px solid var(--line);background:var(--raised);border-radius:var(--r);font-size:.85rem;font-weight:600}
.step[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.work{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.work{grid-template-columns:minmax(0,1fr) 320px}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start}}
.main{display:grid;gap:18px;align-content:start;min-width:0}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:6px}
.notice{padding:10px 14px;border:1px solid var(--steady);background:var(--steady-soft);border-radius:var(--r);margin-top:14px}

/* fields */
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.95rem}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .7rem;min-height:44px}
textarea{resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.cb{width:22px;height:22px;accent-color:var(--accent);flex:none}
.done{text-decoration:line-through;color:var(--muted)}
.lrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lrow input[type=text]{flex:1 1 160px;min-width:0}
.chain{list-style:none;padding:0;display:grid}
.cl{position:relative;display:grid;gap:6px;padding-inline-start:28px;padding-bottom:16px}
.cl::before{content:"";position:absolute;inset-inline-start:7px;top:22px;bottom:-4px;border-inline-start:2px solid var(--line)}
.cl:last-child::before{display:none}
.cl::after{content:"";position:absolute;inset-inline-start:2px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.cl .mono{color:var(--muted)}
.claim{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px;align-items:center}
@media(max-width:560px){.claim{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted)}
.topics{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.topic{display:grid;gap:4px;text-align:start;padding:10px 12px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);font-weight:600}
.topic[aria-pressed="true"]{border-color:var(--gold);background:var(--accent-soft)}
.topic small{color:var(--muted);font-weight:400}

/* tags */
.tag{display:inline-block;font:500 .7rem var(--font-mono);padding:2px 8px;border-radius:999px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.fact{background:var(--fact);color:var(--on-fact);border-color:var(--fact)}
.tag.assumption{color:var(--steady);background:var(--steady-soft)}
.tag.possibility{color:var(--muted);border-style:dashed}
.tag.supports{color:var(--fast);background:var(--fast-soft)}.tag.against{color:var(--bumpy);background:var(--bumpy-soft)}.tag.neutral{color:var(--muted)}

/* coach */
.asks{display:grid;gap:6px;color:var(--ink)}
.coach-out{white-space:pre-wrap;font-size:.95rem;min-height:1.5em}
.coach-out.empty{color:var(--muted)}

/* scenarios */
.scn-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.k-fast{--c:var(--fast);--cs:var(--fast-soft)}.k-steady{--c:var(--steady);--cs:var(--steady-soft)}.k-bumpy{--c:var(--bumpy);--cs:var(--bumpy-soft)}
.scn{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.scn .kind{color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.scn h3{font-size:1.2rem;font-weight:800}
.scn h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.scn ul{display:grid;gap:4px}.basis{list-style:none;padding:0}.basis li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.cmp{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--surface)}
details.cmp summary{font-weight:600;cursor:pointer;min-height:36px;display:flex;align-items:center}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;min-width:640px;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:8px;text-align:start;vertical-align:top}
th{background:var(--raised)}

/* map */
.mapwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px}
.mapsvg{display:block;margin-inline:auto}
.edge{fill:none;stroke:var(--line);stroke-width:1.8}
.node{cursor:pointer}
.node rect{fill:var(--cs,var(--raised));stroke:var(--c,var(--line));stroke-width:1.5}
.node text{fill:var(--ink);font:500 12px var(--font-body)}
.node.root rect{fill:var(--ink);stroke:var(--ink)}.node.root text{fill:var(--bg)}
.node.sel rect{stroke:var(--gold-text);stroke-width:3.5}
.conf-row{display:grid;gap:6px;padding:10px 12px;border-inline-start:5px solid var(--c);background:var(--raised);border-radius:var(--r)}
.conf-row label{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.sigs{list-style:none;padding:0;display:grid;gap:8px}
.sig{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:8px 12px;border-inline-start:5px solid var(--c);background:var(--raised);border-radius:var(--r)}
.sig span{display:grid;min-width:0;flex:1 1 180px}.sig small{color:var(--muted)}

/* ladder */
.ladder{list-style:none;padding:0;display:grid}
.rung{position:relative;padding-inline-start:30px;padding-bottom:18px;display:grid;gap:6px}
.rung::before{content:"\2193";position:absolute;inset-inline-start:0;top:0;font:700 1.1rem var(--font-mono);color:var(--gold-text)}
.rung.goal{padding:12px 12px 12px 30px;background:var(--accent-soft);border-radius:var(--r);margin-bottom:12px}
.rung.goal::before{content:"\2605"}

/* opportunity and test cards */
.stack{display:grid;gap:12px}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:14px}
.xcard.open{border-color:var(--gold)}
.card-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:4px 0;min-height:44px}
.card-head strong{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.status{font:500 .72rem var(--font-mono);padding:2px 8px;border-radius:4px;background:var(--line-soft);text-transform:uppercase;letter-spacing:.05em}
.s-testing,.s-investigating{background:var(--accent-soft);color:var(--accent)}
.s-resolved,.s-looks-real{background:var(--fast-soft);color:var(--fast)}
.s-dropped{background:var(--bumpy-soft);color:var(--bumpy)}
.evl{list-style:none;padding:0;display:grid;gap:6px}
.evl li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.evl li span.t{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;max-width:70ch}
</style>
</head>

</header>

function gradeToLevel(g){if(!g)return 'adult';if(g==='kg')return 'kids';if(g==='university')return 'adult';
 const n=parseInt(String(g).replace('grade_',''),10);if(n>=1&&n<=4)return 'kids';if(n>=5&&n<=8)return 'middle';if(n>=9&&n<=12)return 'high';return 'adult';}
const prefsKey=()=>'fa-prefs:'+userId,cacheKey=()=>'fa-cache:'+userId;
function readPrefs(){try{return JSON.parse(localStorage.getItem(prefsKey())||'{}')||{};}catch(e){return{};}}
function savePrefs(){try{localStorage.setItem(prefsKey(),JSON.stringify({level:S.level,activeId:S.activeId,qIdx:S.qIdx,seeded:true}));}catch(e){}}
function writeCache(){try{localStorage.setItem(cacheKey(),JSON.stringify(S.projects));}catch(e){}}
function setStatus(t){saveText=t;const el=document.getElementById('saveState');if(el)el.textContent=t;}
let timer=null,saving=false,retryTimer=null;
function flushSoon(){setStatus('Saving...');clearTimeout(timer);timer=setTimeout(flush,800);}
function touch(){const p=proj();if(p){p.updated=now();dirtyIds.add(p.id);}flushSoon();}
async function flush(){
 if(saving)return;saving=true;let ok=true;
 try{while(dirtyIds.size||deletedIds.size){
  const ids=Array.from(dirtyIds),dels=Array.from(deletedIds);dirtyIds.clear();deletedIds.clear();
  const rows=ids.map(id=>S.projects.find(p=>p.id===id)).filter(Boolean).map(p=>({user_id:userId,id:p.id,title:String(p.title||'Untitled project').slice(0,200),data:p,updated_at:new Date().toISOString()}));
  try{
   if(rows.length){const r=await sb.from('future_projects').upsert(rows,{onConflict:'user_id,id'});if(r.error)throw r.error;}
   if(dels.length){const r=await sb.from('future_projects').delete().eq('user_id',userId).in('id',dels);if(r.error)throw r.error;}
  }catch(e){ok=false;ids.forEach(i=>dirtyIds.add(i));dels.forEach(i=>deletedIds.add(i));break;}
 }}finally{saving=false;}
 writeCache();
 if(ok){offlineLoad=false;setStatus('Saved');}
 else{setStatus('Could not save. Your changes stay on this device and will retry.');clearTimeout(retryTimer);retryTimer=setTimeout(flush,15000);}
}
async function loadAll(){
 const prefs=readPrefs();let rows=null;
 try{const r=await sb.from('future_projects').select('id,data').eq('user_id',userId).order('created_at',{ascending:true});if(r.error)throw r.error;rows=r.data||[];}catch(e){rows=null;}
 let projects;
 if(rows===null){
  try{projects=JSON.parse(localStorage.getItem(cacheKey())||'null');}catch(e){projects=null;}
  if(!Array.isArray(projects))projects=[];
  offlineLoad=true;setStatus('Could not reach your saved projects. Showing the copy on this device.');
 }else{
  projects=rows.map(r=>r.data).filter(d=>d&&d.id);
  if(!projects.length&&!prefs.seeded){const sp=seedProject();projects=[sp];dirtyIds.add(sp.id);}
  setStatus('Saved');
 }
 S={level:LV_ORDER.includes(prefs.level)?prefs.level:gradeToLevel(gradeLevel),activeId:prefs.activeId,projects:projects,qIdx:prefs.qIdx||0};
 ensure();savePrefs();
 if(dirtyIds.size)flushSoon();
}

function CHAIN(path){const arr=ensureArr(path,['','']),labs=chainLabels();

/* ---------- progress ---------- */
const avg=c=>Object.values(c).reduce((a,b)=>a+b,0)/Object.values(c).length;
function countKids(nodes){return(nodes||[]).reduce((a,n)=>a+(n.children?n.children.length+countKids(n.children):0),0);}
function comp(p){const u=p.understand,f=p.futures,d=p.design,fr=a=>a.filter(Boolean).length/a.length;
 const rungs=Object.values(d.ladder||{}).filter(trim).length;
 return{understand:fr([trim(u.change),trim(u.what),trim(u.why),trim(u.gain),trim(u.lose),filled(u.chain)>=2]),
  opportunities:Math.min(1,p.opps.filter(o=>trim(o.problem)&&trim(o.who)&&trim(o.test)).length/2),
  futures:fr([trim(f.question),f.scenarios.length>=3,countKids(f.scenarios)>=1,f.scenarios.some(s=>s.conf!=null)]),
  design:fr([trim(d.vision),filled(d.conditions)+filled(d.skills)>=2,rungs>=3,filled(d.actions)>=1]),
  test:fr([p.tests.some(t=>trim(t.exp)),p.tests.some(t=>t.evidence.length),p.tests.some(t=>t.status==='Resolved')])};}
function skills(){let q=0,a=0,o=0,pl=0,t=0;
 S.projects.forEach(p=>{q+=(p.coachAsks||0)+filled(p.understand.claims);a+=filled(p.understand.chain)+p.futures.scenarios.length+countKids(p.futures.scenarios);
  o+=p.opps.filter(x=>trim(x.problem)&&trim(x.test)).length;pl+=Object.values(p.design.ladder).filter(trim).length+p.design.actions.filter(x=>x.done&&trim(x.text)).length;
  t+=p.tests.filter(x=>x.evidence.length).length+p.tests.filter(x=>x.updated!=null&&x.updated!==x.conf).length;});
 return[['Questioning',q,10,'Coach challenges and labelled statements'],['Anticipating',a,12,'Effects followed, futures explored'],['Spotting opportunities',o,4,'Problems with a test attached'],['Planning',pl,12,'Backward steps and finished actions'],['Testing and updating',t,6,'Evidence logged and beliefs updated']];}
function calib(){const rs=[];S.projects.forEach(p=>p.tests.forEach(t=>{if(t.status==='Resolved'&&(t.outcome==='supported'||t.outcome==='contradicted'))rs.push(t);}));
 if(rs.length<3)return['Resolve 3 or more tests to see how well your confidence matches what happened.'];
 const out=[],hi=rs.filter(t=>t.conf>=70),lo=rs.filter(t=>t.conf<=40),hit=a=>a.filter(t=>t.outcome==='supported').length;
 if(hi.length)out.push(`Tests where you were 70% or more sure: ${hi.length}. They held up ${hit(hi)} times.`);
 if(lo.length)out.push(`Tests where you were 40% or less sure: ${lo.length}. They held up ${hit(lo)} times.`);
 if(!out.length)out.push(`You have resolved ${rs.length} tests. Try a few at the high and low ends of confidence to compare.`);return out;}
function nextUp(p){const c=comp(p);for(const s of SECTIONS){if(c[s.id]<1)return{section:s.id,label:(avg(c)===0?'Start: ':'Continue: ')+s.title};}return{section:'understand',label:'Start the next loop'};}

const STEPS={
 understand:[{k:'pick',t:'Pick a change'},{k:'explain',t:'What and why'},{k:'people',t:'Who gains, who loses'},{k:'next',t:'And then what?'}],
 futures:[{k:'question',t:'Your question'},{k:'futures',t:'Three futures'},{k:'map',t:'Future map'},{k:'commit',t:'Signals and confidence'}],

const FINAL={understand:['opportunities','Find opportunities'],opportunities:['futures','Explore possible futures'],futures:['design','Design my future'],design:['test','Test my riskiest assumption'],test:['home','Back to the loop']};

 return `<div class="nav">${ui.step>0?`<button class="btn" data-act="step" data-arg="${ui.step-1}">Back</button>`:'<span></span>'}${last?`<button class="btn primary" data-act="${f[0]==='home'?'home':'go'}" data-arg="${f[0]}">${f[1]}</button>`:`<button class="btn primary" data-act="step" data-arg="${ui.step+1}">Next: ${esc(list[ui.step+1].t)}</button>`}</div>`;}
function shell(sec,steps,main,side){const p=proj();
 return `<div class="sec-head"><button class="link" data-act="home">Back to the loop</button><span class="crumb mono">${esc(p.title)}</span></div>
 <h2 class="sec-title"><span class="mono n">${sec.n} / 5</span>${sec.title}</h2><p class="lede small">${esc(pick(sec.intro))}</p>
 ${ui.notice?`<p class="notice" role="status">${esc(ui.notice)}</p>`:''}${steps}<div class="work"><div class="main">${main}</div><aside class="side" aria-label="Coach">${side}</aside></div>`;}
function viewSection(){const sec=SECTIONS.find(s=>s.id===ui.section)||SECTIONS[0];clampStep();
 const list=stepsFor(sec.id);let main='',kind='understand';
 if(sec.id==='understand'){main=[uPick,uExplain,uPeople,uNext][ui.step]();kind='understand';}
 else if(sec.id==='opportunities'){main=viewOpps();kind='opp';}
 else if(sec.id==='futures'){const k=list[ui.step].k;main={question:fQuestion,futures:fFutures,map:fMap,commit:fCommit}[k]();kind=k==='question'?'question':'scenarios';}
 else if(sec.id==='design'){const k=list[ui.step].k;main={vision:dVision,conditions:dConditions,goals:dGoals,ladder:dLadder,stress:dStress}[k]();kind='design';}
 else{main=viewTest();kind='test';}
 return shell(sec,list.length?stepper(list):'',main+(list.length?stepNav(list):FINALBTN()),coachPanel(kind));}
function FINALBTN(){const f=FINAL[ui.section];return `<div class="nav"><span></span><button class="btn primary" data-act="${f[0]==='home'?'home':'go'}" data-arg="${f[0]}">${f[1]}</button></div>`;}

 <div class="topics">${TOPICS[S.level].map((t,i)=>`<button class="topic" data-act="topic" data-arg="${i}" aria-pressed="${u.change===t[0]}"><span>${esc(t[0])}</span><small class="mono">${esc(t[1])}</small></button>`).join('')}</div>
 ${F('understand.change',pick({kids:'My change',all:'The change, in one sentence'}),{line:true})}
 ${atLeast('middle')?SEL('understand.domain','Where is it happening?',[['','Choose...']].concat(DOMAINS)):''}`;}
function uExplain(){return F('understand.what','What is changing?')+F('understand.why',pick({kids:'Why is it changing?',all:'Why is it changing? What is driving it?'}))+(atLeast('middle')?F('understand.brakes','What could slow it down or reverse it?',{rows:2}):'');}

function fQuestion(){const u=proj().understand;
 return `<h2 class="h3">What do you want to know about the future?</h2>`+F('futures.question','My question',{rows:3,ph:'For example: What could happen to school if every student has a personal AI tutor?',hint:'Good questions are open, name who or what, and say by when.'})+(trim(u.change)?'<div><button class="btn small" data-act="q-from-change">Start from my change</button></div>':'');}
function UL(title,a){a=(a||[]).filter(trim);return a.length?`<h4>${title}</h4><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';}
function scnCard(s,i){const ed=ui.editScn.has(s.id),b='futures.scenarios.'+i+'.',mid=atLeast('middle');let body;
 if(ed){body=F(b+'name','Name',{line:true})+F(b+'story','What happens',{rows:3})+(mid?LIST(b+'causes','Causes'):'')+LIST(b+'opps','Opportunities')+LIST(b+'risks','Risks')+(mid?LIST(b+'signals','Early signs')+`<span class="lbl">What this rests on</span>${CLAIMS(b+'basis')}`:'')+`<div><button class="btn small" data-act="fut-edit" data-arg="${s.id}">Done editing</button></div>`;}
 else{body=`<p>${esc(s.story)}</p>${mid?UL('Causes',s.causes):''}${UL('Opportunities',s.opps)}${UL('Risks',s.risks)}${mid?UL('Early signs',s.signals):''}`+

 return `<article class="scn k-${s.kind}"><span class="mono kind">${KIND_LABEL[s.kind]}</span><h3>${esc(s.name||'Untitled future')}</h3>${body}</article>`;}
function fFutures(){const p=proj(),f=p.futures,sc=f.scenarios;
 const gen=aiOk()?`<button class="btn primary" data-act="fut-gen"${ui.busy==='futures'?' disabled':''}>${ui.busy==='futures'?'Thinking...':(sc.length?(ui.confirm==='regen'?'Click again to replace':'Write new futures'):'Draft three futures with Claude')}</button>${ui.busy==='futures'?'<button class="btn small" data-act="stop">Stop</button>':''}`:'';
 if(!sc.length)return `<h2 class="h3">Three possible futures</h2><p class="hint">Question: ${esc(f.question||'(write it in step 1)')}</p><p>Futures are possibilities, not predictions. Draft them with Claude and then challenge them, or write your own.</p><div class="lrow">${gen}<button class="btn" data-act="fut-own">Write my own</button></div>`;

  cmp=`<details class="cmp"><summary>Compare side by side</summary><div class="tablewrap"><table><thead><tr><th></th>${sc.map(s=>`<th scope="col">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${row('Causes','causes')}${row('Opportunities','opps')}${row('Risks','risks')}${row('Early signs','signals')}</tbody></table></div></details>`;}
 return `<h2 class="h3">Three possible futures</h2><p class="hint">Question: ${esc(f.question)}</p>${f.ai?'<p class="notice">Drafted by Claude from your question. These are possibilities, not predictions. Check anything marked Fact before you rely on it, and edit anything you disagree with.</p>':'<p class="hint">These are possibilities, not predictions.</p>'}
 <div class="scn-grid">${sc.map(scnCard).join('')}</div>${cmp}<div class="lrow">${gen}</div>`;}

/* future map */
function layoutMap(p){const f=p.futures,W=148,H=52,GX=14,GY=46,nodes=[];let nx=0,maxD=0;
 const root={id:'root',text:trim(f.question)||'Today',children:f.scenarios.map(s=>({id:s.id,text:s.name||'Future',kind:s.kind,children:s.children,scn:s}))};
 function go(n,d,kind,parent){const node={n,d,kind,parent,x:0,y:d*(H+GY)};nodes.push(node);maxD=Math.max(maxD,d);const kids=n.children||[];
  if(!kids.length){node.x=nx;nx+=W+GX;}else{const cs=kids.map(c=>go(c,d+1,d===0?c.kind:kind,node));node.x=(cs[0].x+cs[cs.length-1].x)/2;}return node;}
 go(root,0,'root',null);return{nodes,W,H,GY,w:Math.max(nx-GX,W)+20,h:maxD*(H+GY)+H+20};}
function wrapTxt(t,max,lines){const w=trim(t).split(/\s+/),out=[];let cur='';
 for(const x of w){if((cur+' '+x).trim().length>max){if(cur)out.push(cur);cur=x;}else cur=(cur+' '+x).trim();}if(cur)out.push(cur);
 if(out.length>lines){out.length=lines;out[lines-1]=out[lines-1].slice(0,max-1).replace(/\s+$/,'')+'...';}return out;}
function findNode(L,id){return L.nodes.find(x=>x.n.id===id);}
function fMap(){const p=proj(),f=p.futures;
 if(!f.scenarios.length)return '<h2 class="h3">Future map</h2><p>Draft or write your three futures first. Then grow the map here.</p><div><button class="btn primary" data-act="step" data-arg="1">Go to three futures</button></div>';
 const L=layoutMap(p);if(!findNode(L,ui.nodeSel))ui.nodeSel='root';
 const edges=L.nodes.filter(x=>x.parent).map(x=>{const a=x.parent,x1=a.x+L.W/2+10,y1=a.y+L.H+10,x2=x.x+L.W/2+10,y2=x.y+10;return `<path class="edge" d="M${x1} ${y1}C${x1} ${y1+L.GY/2} ${x2} ${y2-L.GY/2} ${x2} ${y2}"/>`;}).join('');
 const nodes=L.nodes.map(x=>{const px=x.x+10,py=x.y+10,cx=px+L.W/2,root=x.d===0;
  const lines=root?['TODAY',wrapTxt(x.n.text,22,1)[0]||'']:wrapTxt(x.n.text,22,2),y0=py+L.H/2-(lines.length-1)*7+4;
  return `<g class="node${root?' root':' k-'+x.kind}${x.n.id===ui.nodeSel?' sel':''}" data-act="node" data-arg="${x.n.id}" tabindex="0" role="button" aria-label="${esc(root?'Today':x.n.text)}"><rect x="${px}" y="${py}" width="${L.W}" height="${L.H}" rx="5"/><text text-anchor="middle">${lines.map((t,i)=>`<tspan x="${cx}" y="${y0+i*15}">${esc(t)}</tspan>`).join('')}</text></g>`;}).join('');
 const sel=findNode(L,ui.nodeSel),n=sel.n,d=sel.d;
 const detail=`<div class="card"><h3 class="h3">${d===0?'Today':esc(n.text)}</h3>${d===0?`<p>${esc(f.question||'Add your question in step 1.')}</p><p class="hint">Select a future to ask what could happen next.</p>`:(d===1?`<p>${esc(n.scn.story)}</p>`:'')}
 ${d>=1&&d<5?`<div class="field"><label for="nodeText">If this happens, what could happen next?</label><div class="lrow"><input id="nodeText" type="text" autocomplete="off" placeholder="One possible next step"><button class="btn primary" data-act="node-add" data-arg="${n.id}">Add to map</button></div></div>`:''}
 ${d>=2?`<div><button class="btn small ghost" data-act="node-del" data-arg="${n.id}">Remove this branch</button></div>`:''}</div>`;
 return `<h2 class="h3">Future map</h2><p class="hint">Select a future, then add what could happen next. Each branch is a possibility you can test later.</p><div class="mapwrap"><svg class="mapsvg" role="group" aria-label="Future map" width="${L.w}" height="${L.h}" viewBox="0 0 ${L.w} ${L.h}">${edges}${nodes}</svg></div>${detail}`;}

function fCommit(){const p=proj(),f=p.futures,sc=f.scenarios;
 if(!sc.length)return '<h2 class="h3">Signals and confidence</h2><p>Draft or write your futures first.</p><div><button class="btn primary" data-act="step" data-arg="1">Go to three futures</button></div>';
 const rows=sc.map((s,i)=>`<div class="conf-row k-${s.kind}"><label for="cf_${i}"><span>${esc(s.name)}</span><span class="mono" id="cfo_${i}">${s.conf==null?'not set':s.conf+'%'}</span></label><input id="cf_${i}" type="range" min="0" max="100" step="5" value="${s.conf==null?30:s.conf}" data-bind="futures.scenarios.${i}.conf" data-out="cfo_${i}" data-fmt="pct"></div>`).join('');
 const items=[];sc.forEach(s=>s.signals.forEach((t,i)=>{if(trim(t))items.push({key:s.id+':'+i,t:t,kind:s.kind,name:s.name});}));
 const sigs=items.length?`<ul class="sigs">${items.map(it=>{const st=f.signals[it.key]||SIG_STATES[0];return `<li class="sig k-${it.kind}"><span>${esc(it.t)}<small class="mono">${esc(it.name)}</small></span><button class="btn small" data-act="sig-cycle" data-arg="${esc(it.key)}" aria-label="Signal status: ${st}. Activate to change.">${st}</button></li>`;}).join('')}</ul>`:'<p class="hint">Add early signs to your futures to track them here.</p>';
 const unlogged=sc.filter(s=>s.conf!=null&&!s.logged).length;
 return `<h2 class="h3">How likely does each future feel?</h2><p class="hint">Move a slider to set it. Futures can overlap, so the numbers do not need to add up to 100%. These are your guesses, and you can change them.</p><div class="stack">${rows}</div>
 ${SEL('futures.horizon','Over what time?',['6 months','1 year','3 years','5 years'])}
 <div class="lrow"><button class="btn primary" data-act="fut-log"${unlogged?'':' disabled'}>Save as predictions to test</button></div>
 <h3 class="h4">Early-signal radar</h3><p class="hint">Mark how each sign is moving as you see new evidence. Click a sign to change its status.</p>${sigs}`;}

/* ---------- 4 design ---------- */

function dLadder(){const d=proj().design;

function dStress(){const hi=atLeast('high');return `<h2 class="h3">Before you start, imagine it failed</h2>`+F('design.fail',hi?'Imagine this completely failed. Why?':'What could go wrong?',{rows:3,hint:hi?'Think about money, technology, people, incentives and surprises.':''})+(hi?F('design.guarantee','What would guarantee failure?',{rows:2,hint:'Then flip each answer into a rule for success.'})+LIST('design.safeguards','Safeguards and rules for success'):'');}

/* ---------- 5 test ---------- */
const T_STATUS=['Open','Testing','Resolved'];
const quality=t=>[t.reasoning,t.changeMind,t.exp,t.expSuccess,t.evidence.length,t.lesson].filter(x=>trim(x)).length;
function testCard(t,i){const open=ui.openTest===t.id,b='tests.'+i+'.',mid=atLeast('middle'),q=quality(t);let body='';
 if(open){const ev=t.evidence.length?`<ul class="evl">${t.evidence.map((e,j)=>`<li><span class="tag ${e.dir}">${e.dir}</span><span class="t">${esc(e.text)}</span><span class="mono dim">${fmtDate(e.date)}</span><button class="btn small ghost" data-act="ev-del" data-arg="${t.id}" data-i="${j}">Remove</button></li>`).join('')}</ul>`:'<p class="hint">No evidence yet.</p>';
  body=SEL(b+'type','What is this?',[['prediction','Prediction'],['assumption','Assumption'],['idea','Idea']])+F(b+'statement',pick({kids:'I think...',all:'Statement to test'}),{rows:2})+
  `<div class="field"><label for="tc_${i}">How sure am I? <span class="mono" id="tco_${i}">${t.conf}%</span></label><input id="tc_${i}" type="range" min="0" max="100" step="5" value="${t.conf}" data-bind="tests.${i}.conf" data-out="tco_${i}" data-fmt="pct"></div>`+
  (mid?SEL(b+'horizon','When will I know?',['1 week','1 month','3 months','1 year','3 years']):'')+(mid?F(b+'reasoning','Why do I think so?',{rows:2})+F(b+'changeMind','What would change my mind?',{rows:2}):'')+
  `<h4 class="h4">Small experiment</h4>`+F(b+'exp',pick({kids:'How can I check?',all:'Cheapest test I can run'}),{rows:2})+(mid?F(b+'expSuccess','What result would support it?',{rows:2}):'')+
  SEL(b+'status','Where is it?',T_STATUS,{rerender:true})+
  `<h4 class="h4">Evidence</h4>${ev}<div class="lrow"><input id="ev_${t.id}" type="text" placeholder="What did you find out?" autocomplete="off" aria-label="New evidence"><select id="evd_${t.id}" aria-label="Does it support the statement?"><option value="supports">Supports</option><option value="against">Against</option><option value="neutral">Neutral</option></select><button class="btn" data-act="ev-add" data-arg="${t.id}">Add evidence</button></div>`+
  (t.status==='Resolved'||t.evidence.length?SEL(b+'outcome','What happened?',[['','Choose...'],['supported','Supported'],['mixed','Mixed'],['contradicted','Contradicted']])+`<div class="field"><label for="tu_${i}">How sure am I now? <span class="mono" id="tuo_${i}">${t.updated==null?t.conf:t.updated}%</span></label><input id="tu_${i}" type="range" min="0" max="100" step="5" value="${t.updated==null?t.conf:t.updated}" data-bind="tests.${i}.updated" data-out="tuo_${i}" data-fmt="pct"></div>`+F(b+'lesson','What did I learn?',{rows:2}):'')+
  `<p class="hint">Thinking quality: ${q} of 6. This counts reasoning, a real test, evidence and a lesson. It does not count whether you were right.</p><div><button class="btn ghost" data-act="test-del" data-arg="${t.id}">${ui.confirm==='test:'+t.id?'Click again to delete':'Delete'}</button></div>`;}
 const shift=t.updated!=null&&t.updated!==t.conf?`<span class="mono">${t.conf}% to ${t.updated}%</span>`:`<span class="mono dim">${t.conf}% sure</span>`;
 return `<article class="xcard${open?' open':''}"><button class="card-head" data-act="test-open" data-arg="${t.id}" aria-expanded="${open}"><span class="status s-${slug(t.status)}">${t.status}</span><strong>${esc(t.statement||'New idea')}</strong>${shift}<span class="mono dim">thinking ${q}/6</span></button>${body}</article>`;}
function viewTest(){const p=proj();
 return `<div class="card"><h2 class="h3">Record something to test</h2><div class="lrow"><select id="newTestType" aria-label="Type"><option value="prediction">Prediction</option><option value="assumption">Assumption</option><option value="idea">Idea</option></select><input id="newTestText" type="text" placeholder="${esc(pick({kids:'I think...',all:'For example: most parents would read a weekly summary'}))}" autocomplete="off" aria-label="Statement"><button class="btn primary" data-act="test-add">Add</button></div><p class="hint">Your confidence check: ${esc(calib()[0])}</p></div>
 <div class="stack">${p.tests.length?p.tests.map(testCard).join(''):'<p class="hint">Nothing here yet. Add a prediction, an assumption from your plan, or an idea.</p>'}</div>`;}

const $app=document.getElementById('app');

function act(a,arg,el){const I=el.getAttribute('data-i')!=null?Number(el.getAttribute('data-i')):null,p=proj(),u=p.understand,f=p.futures;
 switch(a){
 case 'home':ui.view='home';ui.notice='';ui.confirm=null;render({top:true});break;
 case 'go':goSection(arg,0);break;
 case 'level':S.level=arg;ui.coach={};clampStep();savePrefs();render();break;
 case 'step':ui.step=Number(arg);ui.notice='';render({top:true});break;
 case 'topic':{const t=TOPICS[S.level][Number(arg)];u.change=t[0];u.domain=t[1];if(!trim(p.title)||p.title==='Untitled project')p.title=t[0].slice(0,70);touch();render();break;}
 case 'proj-open':S.activeId=arg;ui.confirm=null;savePrefs();render();break;
 case 'proj-new':{const np=blank();S.projects.push(np);S.activeId=np.id;savePrefs();touch();goSection('understand',0);break;}
 case 'proj-dup':{const src=S.projects.find(x=>x.id===arg);if(src){const c=JSON.parse(JSON.stringify(src));c.id='p_'+uid();c.title=src.title+' (copy)';c.example=false;c.created=c.updated=now();S.projects.push(c);S.activeId=c.id;savePrefs();touch();render();}break;}
 case 'proj-del':if(!confirmed('del:'+arg))break;S.projects=S.projects.filter(x=>x.id!==arg);deletedIds.add(arg);dirtyIds.delete(arg);if(!S.projects.length){const nb=blank();S.projects.push(nb);dirtyIds.add(nb.id);}if(S.activeId===arg)S.activeId=S.projects[0].id;savePrefs();flushSoon();render();break;
 case 'q-next':S.qIdx=(S.qIdx||0)+1;savePrefs();render();break;
 case 'arr-add':{const arr=getPath(p,arg),k=el.getAttribute('data-kind');arr.push(k==='check'?{text:'',done:false}:(k==='claim'?{text:'',type:'assumption'}:''));
  ui.focus=idFor(arg+'.'+(arr.length-1)+(k==='str'?'':'.text'));touch();render();break;}
 case 'arr-del':{const arr=getPath(p,arg);arr.splice(I,1);touch();render();break;}
 case 'cond-test':{const txt=trim(p.design.conditions[I]);if(!txt)break;let t=p.tests.find(x=>x.fromCond===txt);
  if(!t){t=mkTest({type:'assumption',statement:txt,fromCond:txt});p.tests.push(t);touch();}
  goSection('test',0);ui.openTest=t.id;ui.notice='Added to Test My Ideas. Design a small experiment and record what you find.';render({top:true});break;}
 case 'opp-add':{const o={id:uid(),problem:'',who:'',why:'',evidence:'',existing:'',vanish:'',test:'',conf:30,status:'Idea',ai:false,testId:null};p.opps.push(o);ui.openOpp=o.id;ui.focus=idFor('opps.'+(p.opps.length-1)+'.problem');touch();render();break;}
 case 'opp-open':ui.openOpp=ui.openOpp===arg?null:arg;render();break;
 case 'opp-del':if(!confirmed('opp:'+arg))break;p.opps=p.opps.filter(x=>x.id!==arg);touch();render();break;
 case 'opp-ai':suggestOpps();break;
 case 'opp-test':{const o=p.opps.find(x=>x.id===arg);if(!o)break;let t=o.testId&&p.tests.find(x=>x.id===o.testId);
  if(!t){t=mkTest({type:'assumption',statement:(trim(o.who)||'People')+' have this problem often enough to want a solution: '+trim(o.problem),conf:o.conf,exp:o.test,fromOpp:o.id});p.tests.push(t);o.testId=t.id;if(o.status==='Idea')o.status='Investigating';touch();}
  goSection('test',0);ui.openTest=t.id;ui.notice='Added to Test My Ideas. Run the experiment, then record what you find.';render({top:true});break;}
 case 'fut-gen':if(f.scenarios.length&&!confirmed('regen'))break;genFutures();break;
 case 'fut-own':f.scenarios=['fast','steady','bumpy'].map(blankScn);f.ai=false;f.signals={};ui.editScn=new Set(f.scenarios.map(s=>s.id));touch();render();break;
 case 'fut-edit':if(ui.editScn.has(arg))ui.editScn.delete(arg);else ui.editScn.add(arg);render();break;
 case 'node':ui.nodeSel=arg;render();break;
 case 'node-add':{const inp=document.getElementById('nodeText'),txt=inp?trim(inp.value):'';if(!txt)break;
  const L=layoutMap(p),nd=findNode(L,arg);if(!nd||nd.d<1||nd.d>=5)break;const kids=nd.d===1?nd.n.scn.children:nd.n.children;const c={id:'c_'+uid(),text:txt,children:[]};kids.push(c);
  ui.nodeSel=arg;touch();render();const again=document.getElementById('nodeText');if(again)again.focus();break;}
 case 'node-del':{const L=layoutMap(p),nd=findNode(L,arg);if(!nd||nd.d<2)break;const par=nd.parent,arr=par.d===1?par.n.scn.children:par.n.children,ix=arr.findIndex(x=>x.id===arg);if(ix>=0)arr.splice(ix,1);ui.nodeSel=par.n.id;touch();render();break;}
 case 'sig-cycle':{const cur=f.signals[arg]||SIG_STATES[0];f.signals[arg]=SIG_STATES[(SIG_STATES.indexOf(cur)+1)%SIG_STATES.length];touch();render();break;}
 case 'q-from-change':f.question='What could happen next with "'+trim(u.change)+'", and what should we do about it?';touch();render();break;
 case 'fut-log':{let n=0;f.scenarios.forEach(s=>{if(s.conf!=null&&!s.logged){const first=trim(s.story).split(/(?<=[.!?])\s/)[0]||s.name;p.tests.push(mkTest({type:'prediction',statement:(s.name||'Future')+': '+first,conf:s.conf,horizon:f.horizon,fromScn:s.id}));s.logged=true;n++;}});
  if(n){touch();ui.notice='Added '+n+' prediction'+(n>1?'s':'')+' to Test My Ideas. Open that step to design a small test for each.';}render({top:true});break;}
 case 'test-add':{const tx=document.getElementById('newTestText'),ty=document.getElementById('newTestType'),txt=tx?trim(tx.value):'';if(!txt)break;
  const t=mkTest({type:ty?ty.value:'idea',statement:txt});p.tests.push(t);ui.openTest=t.id;touch();render();break;}
 case 'test-open':ui.openTest=ui.openTest===arg?null:arg;render();break;
 case 'test-del':if(!confirmed('test:'+arg))break;p.tests=p.tests.filter(x=>x.id!==arg);touch();render();break;
 case 'ev-add':{const t=p.tests.find(x=>x.id===arg),inp=document.getElementById('ev_'+arg),sel=document.getElementById('evd_'+arg),txt=inp?trim(inp.value):'';if(!t||!txt)break;
  t.evidence.push({id:uid(),text:txt,dir:sel?sel.value:'neutral',date:now()});if(t.status==='Open')t.status='Testing';touch();render();break;}
 case 'ev-del':{const t=p.tests.find(x=>x.id===arg);if(t){t.evidence.splice(I,1);touch();render();}break;}
 case 'coach':askCoach(arg);break;
 case 'stop':if(ui.ctl)ui.ctl.abort();break;
 }}

/* ---------- AI ---------- */
const LANGS={en:'English',ar:'Arabic',fr:'French',es:'Spanish',zh:'Chinese'};
function langLine(){let l='en';try{l=localStorage.getItem('language')||'en';}catch(e){}
 return l==='en'||!LANGS[l]?'':' Write all learner-facing text in '+LANGS[l]+'. Keep JSON field names and the words fact, assumption and possibility in English.';}
async function callAI(prompt,maxTokens,signal){
 let r;
 try{r=await fetch('/api/ask-ai',{method:'POST',headers:await aiHeaders(sb),body:JSON.stringify({prompt:prompt,maxTokens:maxTokens||1200}),signal:signal});}
 catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:'upstream_error'};}
 let d;try{d=await r.json();}catch(e){throw{code:'upstream_error'};}
 if(d.error||!d.text)throw{code:r.status===429?'rate_limited':'upstream_error',message:d.error};
 return d.text;}
function parseJSON(text){
 try{return JSON.parse(text);}catch(e){}
 const fence=String(text).match(/```(?:json)?\s*([\s\S]*?)```/);if(fence){try{return JSON.parse(fence[1]);}catch(e){}}
 const a=String(text).search(/[\[{]/),b=Math.max(String(text).lastIndexOf('}'),String(text).lastIndexOf(']'));
 if(a>=0&&b>a){try{return JSON.parse(String(text).slice(a,b+1));}catch(e){}}
 throw{code:'invalid_json'};}
function errCopy(e){const c=e&&e.code;
 if(c==='rate_limited')return 'Claude is busy, or your usage limit was reached. Try again later.';
 if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')return 'Claude is not available for this page.';
 if(c==='refused')return 'Claude could not help with that wording. Try rephrasing.';
 if(c==='invalid_json')return 'Claude\'s answer could not be read. Try again.';
 return 'Something went wrong. Try again.';}
function aiFail(e){const c=e&&e.code;if(c==='cancelled')return;ui.notice=errCopy(e);
 if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')aiBlocked=true;}
function ctxFor(kind){const p=proj(),u=p.understand,f=p.futures,d=p.design,L=['Project: '+p.title];
 const add=(k,v)=>{if(trim(v))L.push(k+': '+trim(v));};
 if(kind==='understand'||kind==='opp'||kind==='question'){add('Change',u.change);add('Where',u.domain);add('What is changing',u.what);add('Why',u.why);add('What could slow it',u.brakes);add('Who gains',u.gain);add('Who loses',u.lose);add('Incentives',u.incentive);u.chain.forEach((c,i)=>add('Effect '+(i+1),c));u.claims.forEach(c=>add('Statement ('+c.type+')',c.text));}
 if(kind==='question')add('Learner question',f.question);
 if(kind==='opp')p.opps.forEach((o,i)=>{add('Opportunity '+(i+1),o.problem);add('  who',o.who);add('  existing',o.existing);add('  test',o.test);});
 if(kind==='scenarios'){add('Question',f.question);f.scenarios.forEach(s=>{add('Future ('+KIND_LABEL[s.kind]+')',s.name+'. '+s.story);add('  risks',s.risks.join('; '));add('  early signs',s.signals.join('; '));});}
 if(kind==='design'){add('Vision',d.vision);add('Outcome',d.outcome);add('Conditions',d.conditions.join('; '));add('Skills',d.skills.join('; '));Object.keys(d.ladder).forEach(k=>add('Backward step '+k,d.ladder[k]));add('Imagined failure',d.fail);add('What would guarantee failure',d.guarantee);}
 if(kind==='test')p.tests.forEach((t,i)=>{add('Test '+(i+1),t.statement+' ('+t.conf+'% sure)');add('  reasoning',t.reasoning);add('  would change mind',t.changeMind);add('  experiment',t.exp);add('  evidence',t.evidence.map(e=>e.dir+': '+e.text).join('; '));});
 return L.join('\n');}
async function askCoach(kind){
 const key=ui.view+':'+ui.section+':'+ui.step+':'+kind,c=ui.coach={key:key,status:'thinking',text:''};ui.ctl=new AbortController();refreshCoach();
 const input=PERSONA[S.level]+'\n\n'+BASE+langLine()+'\n\nTask: '+TASK[kind]+'\n\nThe learner\'s work:\n'+ctxFor(kind);
 try{const text=await callAI(input,1500,ui.ctl.signal);c.status='done';c.text=text;const p=proj();p.coachAsks=(p.coachAsks||0)+1;touch();}
 catch(e){if(e&&e.code==='cancelled'){c.status='idle';}else{c.status='error';c.error=errCopy(e);}}
 ui.ctl=null;if(ui.coach===c)refreshCoach();}
const S1=(v,n)=>trim(v).slice(0,n||220);
const SA=(v,k)=>Array.isArray(v)?v.map(x=>S1(typeof x==='string'?x:x&&x.text)).filter(Boolean).slice(0,k||4):[];
async function suggestOpps(){const p=proj(),topic=trim(p.understand.change)||trim(p.title);if(!topic||!aiOk())return;
 ui.busy='opps';ui.notice='';ui.ctl=new AbortController();render();
 const prompt=PERSONA[S.level]+'\n\n'+BASE+langLine()+'\n\nA learner is studying this change: "'+topic+'".\nWhat the learner wrote:\n'+ctxFor('understand')+'\n\nSuggest exactly 3 different problems this change could create for real people that someone might build a solution for. These are ideas to investigate, not proven opportunities.\nReply with only a JSON array of 3 objects with these string fields: problem, who, why, existing, vanish, test.\n- problem: the problem in one sentence\n- who: who has it\n- why: why it may become more important\n- existing: what people use today instead\n- vanish: what could make the opportunity disappear\n- test: the cheapest test the learner could run in a week with free or cheap tools\nUse simple words. Do not invent statistics, company names or quotes. Keep each field under 25 words.';
 try{const r=parseJSON(await callAI(prompt,2500,ui.ctl.signal));const arr=Array.isArray(r)?r:(r&&r.opportunities);if(!Array.isArray(arr)||!arr.length)throw{code:'invalid_json'};
  arr.slice(0,3).forEach(x=>{p.opps.push({id:uid(),problem:S1(x.problem),who:S1(x.who),why:S1(x.why),evidence:'',existing:S1(x.existing),vanish:S1(x.vanish),test:S1(x.test),conf:30,status:'Idea',ai:true,testId:null});});
  ui.openOpp=p.opps[p.opps.length-1].id;touch();}
 catch(e){aiFail(e);}
 ui.busy=null;ui.ctl=null;render();}
function normScn(r,i){r=r||{};const kinds=['fast','steady','bumpy'],names=['Fast and helpful','Slow and steady','Bumpy and difficult'];
 const basis=Array.isArray(r.basis)?r.basis.map(b=>({text:S1(b&&b.text),type:['fact','assumption','possibility'].indexOf(b&&b.type)>=0?b.type:'possibility'})).filter(b=>b.text).slice(0,5):[];
 return{id:'s_'+uid(),kind:kinds[i],name:S1(r.name,60)||names[i],story:S1(r.story,420),causes:SA(r.causes),opps:SA(r.opportunities||r.opps),risks:SA(r.risks),signals:SA(r.signals),basis:basis,children:[],conf:null,logged:false};}
async function genFutures(){const p=proj(),q=trim(p.futures.question);
 if(!q){ui.notice='Write your question in step 1 first.';render();return;}if(!aiOk())return;
 ui.busy='futures';ui.notice='';ui.ctl=new AbortController();render();
 const prompt=PERSONA[S.level]+'\n\n'+BASE+langLine()+'\n\nThe learner asks this question about the future: "'+q+'".\nWhat the learner wrote about the change:\n'+ctxFor('understand')+'\n\nWrite exactly three different possible futures, in this order: 1) rapid, positive development, 2) gradual development, 3) difficult, negative development. They are possibilities, never predictions. Never give probabilities.\nReply with only a JSON object {"scenarios":[...]} holding 3 objects with these fields: name (under 5 words), story (2 sentences), causes (array of 2 or 3 short strings), opportunities (2 or 3), risks (2 or 3), signals (2 or 3 early signs a learner could watch for), basis (array of 3 objects {"text": string, "type": "fact" | "assumption" | "possibility"}).\nRules for basis: use "fact" only for widely documented present-day or historical facts the learner could check; use "assumption" for things taken for granted; use "possibility" for anything about the future. Do not invent statistics, names or quotes. Keep each string under 16 words.';
 try{const r=parseJSON(await callAI(prompt,4000,ui.ctl.signal));const arr=Array.isArray(r)?r:(r&&r.scenarios);if(!Array.isArray(arr)||arr.length<3)throw{code:'invalid_json'};
  p.futures.scenarios=arr.slice(0,3).map(normScn);p.futures.ai=true;p.futures.signals={};ui.editScn=new Set();ui.nodeSel='root';touch();}
 catch(e){aiFail(e);}
 ui.busy=null;ui.ctl=null;render();}

/* ---------- boot ---------- */
async function boot(){
 const user=await window.SSAuth.requireAuth();if(!user)return;
 userId=user.id;sb=window.SSAuth.client;
 try{const r=await sb.from('profiles').select('grade_level').eq('id',userId).maybeSingle();gradeLevel=r.data&&r.data.grade_level;if(user.role==='teacher')gradeLevel=null;}catch(e){}
 await loadAll();render();
 window.addEventListener('beforeunload',()=>{if(dirtyIds.size||deletedIds.size)flush();});
}
boot();
})();
