<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/i18n.js?v=1"></script>
<link href="css/rtl.css?v=2" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plans and pricing — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2; --danger:#B5533C; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); padding-bottom:60px;}
  h1,h2,h3{font-family:'Fraunces',serif; color:var(--ink);}
  header.top{background:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 100%); color:var(--cream); padding:22px 18px 26px;}
  header.top .eyebrow{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:4px; font-weight:700;}
  header.top h1{margin:0; font-size:24px; color:var(--cream);}
  header.top a{color:var(--gold); font-size:13px; text-decoration:none; display:inline-block; margin-top:8px;}
  .wrap{padding:18px; max-width:760px; margin:0 auto;}
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;}
  .card.current{border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,78,.25);}
  .tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; background:var(--gold); color:var(--ink); padding:3px 10px; border-radius:20px; margin-bottom:8px;}
  .price{font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--ink); margin:6px 0 2px;}
  .muted{font-size:13px; color:#777;}
  ul.feat{list-style:none; padding:0; margin:12px 0;}
  ul.feat li{padding:5px 0; padding-inline-start:24px; position:relative; font-size:14.5px;}
  ul.feat li::before{content:'✓'; position:absolute; inset-inline-start:0; color:var(--sage); font-weight:700;}
  .btn{background:var(--ink); color:#fff; border:0; border-radius:12px; padding:13px 18px; font-weight:700; font-size:15px; cursor:pointer; width:100%; font-family:inherit;}
  .btn.gold{background:var(--gold); color:var(--ink);}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .btn:disabled{opacity:.55;}
  .bar{height:10px; border-radius:8px; background:#EFE8D8; overflow:hidden; margin:8px 0 4px;}
  .bar > i{display:block; height:100%; background:var(--sage);}
  .row{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:4px 0;}
  label{display:block; font-size:13px; font-weight:600; margin:12px 0 5px; color:var(--ink);}
  select,input,textarea{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px; font:inherit; font-size:15px; background:#fff;}
  .opt{display:flex; gap:8px;}
  .opt button{flex:1; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:11px 6px; font-weight:600; cursor:pointer; font-family:inherit; font-size:14px;}
  .opt button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .pay{background:#FBF4E2; border:1px dashed var(--gold); border-radius:12px; padding:14px; margin-top:12px; font-size:14.5px; line-height:1.55;}
  .pay .big{font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--ink);}
  .msg{padding:11px 13px; border-radius:10px; font-size:14px; margin-top:12px;}
  .msg.err{background:#FBEAE5; color:var(--danger);}
  .msg.ok{background:#E8F1EA; color:#3E6B48;}
  .hidden{display:none;}
  .ref{font-family:monospace; background:#F3EEE0; padding:2px 7px; border-radius:6px; word-break:break-all; direction:ltr; unicode-bidi:embed;}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>Plans and pricing</h1>
  <a href="skillstream-home.html">&larr; Home</a>
</header>

<div class="wrap">
  <div id="mine"></div>
  <div id="orderPanel"></div>
  <div id="plans">Loading…</div>
</div>

<script>
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null, summary = null, plans = [], methods = [];
let choice = { plan:null, period:'monthly', provider:null };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
const LOCALES = { en:'en-US', fr:'fr-FR', es:'es-ES', zh:'zh-CN', ar:'ar-EG-u-nu-latn' };
function money(cents, cur){
  const l = (window.LNE_I18N && LNE_I18N.lang) || 'en';
  return (cents/100).toLocaleString(LOCALES[l] || 'en-US', {maximumFractionDigits:2}) + ' ' + esc(cur||'');
}
function msg(m){ return esc(m || 'Something went wrong. Please try again.'); }

// Plan names, descriptions and benefits are built from codes/keys so they translate with the site.
const PLAN_NAME = { free:'Free', premium:'Premium' };
const PLAN_DESC = { free:'The essentials for learning, for free.', premium:'More AI and more tools to go further.' };
function featureText(f, value){
  const v = (typeof value === 'number') ? value : parseInt(value, 10);
  if(f.feature_key === 'core_learning') return 'Courses, lessons, challenges and classrooms';
  if(f.feature_key === 'ai_requests_per_day') return v < 0 ? 'Unlimited AI requests per day' : v + ' AI requests per day';
  if(f.feature_key === 'saved_future_projects') return v < 0 ? 'Unlimited Future Architect projects' : v + ' Future Architect projects';
  return f.label_fr || f.feature_key;
}

async function load(){
  const s = await sb.auth.getSession();
  session = s.data.session;
  const p = await sb.from('plans').select('id, code, name, description, price_monthly_cents, price_yearly_cents, currency, sort_order, plan_features(feature_key, value, label_fr, sort_order)').eq('is_active', true).order('sort_order');
  plans = p.data || [];
  if(session){
    const r = await sb.rpc('my_plan_summary'); summary = r.data || null;
    const m = await sb.from('payment_methods').select('code, name, account_label, account_value, instructions').eq('is_active', true).order('sort_order');
    methods = m.data || [];
    if(methods.length && !choice.provider) choice.provider = methods[0].code;
  }
  renderMine(); renderOrder(); renderPlans();
}

function renderMine(){
  const el = document.getElementById('mine');
  if(!session || !summary){ el.innerHTML = ''; return; }
  const lim = summary.ai_limit_per_day, used = summary.ai_used_today || 0;
  const unlimited = lim === -1, pct = (lim && lim > 0) ? Math.min(100, Math.round(used*100/lim)) : 0;
  const planLabel = PLAN_NAME[summary.plan] || summary.plan_name || summary.plan;
  el.innerHTML = '<div class="card current"><h3 style="margin:0 0 6px">My plan</h3>'
    + '<div class="row"><span>Current plan</span><b>' + esc(planLabel) + '</b></div>'
    + (summary.expires_at ? '<div class="row"><span>Valid until</span><b>' + new Date(summary.expires_at).toLocaleDateString(LOCALES[(window.LNE_I18N && LNE_I18N.lang) || 'en'] || 'en-US') + '</b></div>' : '')
    + '<div class="row"><span>AI requests today</span><b>' + used + (unlimited ? ' / ∞' : (lim != null ? ' / ' + lim : '')) + '</b></div>'
    + (!unlimited && lim ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '')
    + (summary.credit_balance ? '<div class="row"><span>AI credits</span><b>' + summary.credit_balance + '</b></div>' : '')
    + '<div class="muted">The counter resets every day (UTC time).</div></div>';
}

function renderPlans(){
  const el = document.getElementById('plans');
  const cur = summary ? summary.plan : (session ? 'free' : null);
  el.innerHTML = plans.map(function(p){
    const feats = (p.plan_features || []).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(f => '<li>' + esc(featureText(f, f.value)) + '</li>').join('');
    const isFree = p.code === 'free';
    const name = PLAN_NAME[p.code] || p.name;
    const desc = PLAN_DESC[p.code] || p.description || '';
    let price = isFree ? '<div class="price">Free</div>'
      : (p.price_monthly_cents ? '<div class="price"><b>' + money(p.price_monthly_cents, p.currency) + '</b> <span class="muted">/ month</span></div>'
         + (p.price_yearly_cents ? '<div class="muted">or ' + money(p.price_yearly_cents, p.currency) + ' / year</div>' : '')
         : '<div class="price">Coming soon</div><div class="muted">The price will be announced soon.</div>');
    let cta = '';
    if(cur === p.code) cta = '<button class="btn ghost" disabled>Your current plan</button>';
    else if(!isFree){
      const canBuy = !!(p.price_monthly_cents || p.price_yearly_cents) && (!session || methods.length);
      cta = canBuy ? '<button class="btn gold" onclick="startOrder(\'' + esc(p.code) + '\')">Choose ' + esc(name) + '</button>'
                   : '<button class="btn ghost" disabled>Coming soon</button>';
    }
    return '<div class="card' + (cur === p.code ? ' current' : '') + '">' + (cur === p.code ? '<span class="tag">Current</span>' : '')
      + '<h2 style="margin:0">' + esc(name) + '</h2><div class="muted">' + esc(desc) + '</div>'
      + price + '<ul class="feat">' + feats + '</ul>' + cta + '</div>';
  }).join('') || '<div class="muted">No plans yet.</div>';
}

function planByCode(c){ return plans.find(p => p.code === c); }
function methodByCode(c){ return methods.find(m => m.code === c); }

function startOrder(code){
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  const p = planByCode(code);
  choice.plan = code;
  choice.period = p.price_monthly_cents ? 'monthly' : 'yearly';
  window._stage = 'choose'; window._order = null;
  renderOrder();
  document.getElementById('orderPanel').scrollIntoView({behavior:'smooth'});
}

function setPeriod(v){ choice.period = v; renderOrder(); }

function payBox(o){
  const m = methodByCode(o.provider) || {};
  return '<div class="pay"><div>Exact amount to pay</div><div class="big">' + money(o.amount_cents, o.currency) + '</div>'
    + '<div style="margin-top:8px">' + esc(m.name || o.provider) + '</div>'
    + (m.account_value ? '<div><b>' + esc(m.account_label || 'Account') + '</b> <span class="ref">' + esc(m.account_value) + '</span></div>' : '')
    + (m.instructions ? '<div class="muted" style="margin-top:6px">' + esc(m.instructions) + '</div>' : '') + '</div>';
}

function renderOrder(){
  const el = document.getElementById('orderPanel');
  const open = summary && summary.open_order;
  if(window._stage === 'choose' && choice.plan){
    const p = planByCode(choice.plan);
    const name = PLAN_NAME[p.code] || p.name;
    el.innerHTML = '<div class="card"><h3 style="margin:0 0 4px">Upgrade to ' + esc(name) + '</h3>'
      + '<label>Duration</label><div class="opt">'
      + (p.price_monthly_cents ? '<button class="' + (choice.period==='monthly'?'on':'') + '" onclick="setPeriod(\'monthly\')"><span>Monthly</span><br><b>' + money(p.price_monthly_cents,p.currency) + '</b></button>' : '')
      + (p.price_yearly_cents ? '<button class="' + (choice.period==='yearly'?'on':'') + '" onclick="setPeriod(\'yearly\')"><span>Yearly</span><br><b>' + money(p.price_yearly_cents,p.currency) + '</b></button>' : '')
      + '</div><label>Payment method</label><select id="prov" onchange="choice.provider=this.value">'
      + methods.map(m => '<option value="' + esc(m.code) + '"' + (m.code===choice.provider?' selected':'') + '>' + esc(m.name) + '</option>').join('') + '</select>'
      + '<button class="btn" style="margin-top:14px" id="goBtn" onclick="createOrder()">Continue</button>'
      + '<button class="btn ghost" style="margin-top:8px" onclick="window._stage=null; renderOrder();">Cancel</button>'
      + '<div id="oMsg"></div></div>';
    return;
  }
  if(open && open.status === 'pending'){
    el.innerHTML = '<div class="card"><h3 style="margin:0 0 4px">Finish your payment</h3>'
      + '<div class="muted"><b>' + esc(PLAN_NAME[open.plan] || open.plan) + '</b> · <span>' + (open.period==='yearly'?'Yearly':'Monthly') + '</span></div>'
      + payBox(open)
      + '<label>Payment reference (received after paying)</label><input id="ref" maxlength="64" placeholder="123456789">'
      + '<label>Note (optional)</label><input id="note" maxlength="300">'
      + '<button class="btn gold" style="margin-top:14px" id="subBtn" onclick="submitPay(\'' + esc(open.id) + '\')">I have paid</button>'
      + '<button class="btn ghost" style="margin-top:8px" onclick="cancelOrder(\'' + esc(open.id) + '\')">Cancel this order</button>'
      + '<div id="oMsg"></div></div>';
    return;
  }
  if(open && open.status === 'submitted'){
    el.innerHTML = '<div class="card"><h3 style="margin:0 0 4px">Payment being verified</h3>'
      + '<div class="muted"><span>Reference sent</span> <span class="ref">' + esc(open.payment_reference) + '</span></div>'
      + '<div class="msg ok">We are checking your payment. Your plan will be activated as soon as it is approved. Come back to this page to see the status.</div></div>';
    return;
  }
  el.innerHTML = '';
}

async function createOrder(){
  const b = document.getElementById('goBtn'); b.disabled = true;
  const r = await sb.rpc('create_order', { p_plan_code: choice.plan, p_period: choice.period, p_provider: choice.provider });
  if(r.error){ document.getElementById('oMsg').innerHTML = '<div class="msg err">' + msg(r.error.message) + '</div>'; b.disabled = false; return; }
  window._stage = null; await load();
}

async function submitPay(id){
  const ref = document.getElementById('ref').value.trim();
  const note = document.getElementById('note').value.trim();
  const b = document.getElementById('subBtn'); b.disabled = true;
  const r = await sb.rpc('submit_payment', { p_order: id, p_reference: ref, p_note: note || null });
  if(r.error){ document.getElementById('oMsg').innerHTML = '<div class="msg err">' + msg(r.error.message) + '</div>'; b.disabled = false; return; }
  await load();
}

async function cancelOrder(id){
  await sb.rpc('cancel_order', { p_order: id });
  await load();
}

load();
</script>
<script src="js/nav.js" defer></script>
</body>
</html>
