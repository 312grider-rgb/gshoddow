<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/i18n.js?v=1"></script>
<link href="css/rtl.css?v=2" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); padding-bottom:84px;}
  h1,h2,h3{font-family:'Fraunces',serif; color:var(--ink);}
  header.top{background:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 100%); color:var(--cream); padding:22px 18px 26px;}
  header.top .eyebrow{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:4px; font-weight:700;}
  header.top h1{margin:0; font-size:24px; color:var(--cream);}
  header.top p{margin:8px 0 0; font-size:14px; color:rgba(251,247,239,.8); line-height:1.5;}
  header.top a{color:var(--gold); font-size:13px; text-decoration:none; display:inline-block; margin-top:10px;}
  .wrap{padding:18px; max-width:760px; margin:0 auto;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .row h2{margin:0; font-size:19px;}
  button{font-family:inherit; cursor:pointer;}
  .btn{background:var(--ink); color:#fff; border:none; border-radius:9px; padding:10px 15px; font-size:13.5px; font-weight:600;}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .btn.small{padding:7px 11px; font-size:12.5px;}
  .btn[disabled]{opacity:.55; cursor:default;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
  .card h3{margin:0 0 4px; font-size:17px;}
  .topic{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--sage);}
  .desc{font-size:14px; line-height:1.5; margin:6px 0;}
  .meta{font-size:12.5px; color:#6B6558;}
  .actions{display:flex; gap:8px; margin-top:10px;}
  form.box{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; display:none;}
  form.box.show{display:block;}
  input[type=text], textarea{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px; font:inherit; font-size:15px; background:#fff; margin-bottom:10px;}
  textarea{min-height:84px; resize:vertical;}
  .msg{font-size:13.5px; margin:8px 0; min-height:18px;}
  .msg.err{color:#A33A2B;} .msg.ok{color:#3F6B47;}
  .post{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
  .post.reply{margin:8px 0 0 18px; background:#FDFBF6;}
  [dir=rtl] .post.reply{margin:8px 18px 0 0;}
  .post .who{font-weight:700; font-size:13.5px; color:var(--ink);}
  .badge{display:inline-block; background:#FBF4E2; color:#8A6A1F; border-radius:8px; padding:1px 7px; font-size:11px; font-weight:700; margin-inline-start:6px;}
  .post .body{font-size:14.5px; line-height:1.55; margin:6px 0; white-space:pre-wrap; word-wrap:break-word;}
  .post .tools{display:flex; gap:14px; flex-wrap:wrap;}
  .link{background:none; border:none; padding:0; color:#6B6558; font-size:12.5px; text-decoration:underline;}
  .hiddenNote{font-size:12.5px; color:#A33A2B; font-weight:600;}
  .post.isHidden .body{opacity:.55;}
  .note{font-size:12.5px; color:#6B6558; margin:6px 0 12px;}
  .attach{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px;}
  .attach .pick{background:#fff; border:1.5px dashed var(--line); border-radius:9px; padding:8px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;}
  .attach input[type=file]{display:none;}
  .attach .chosen{font-size:12.5px; color:#6B6558; word-break:break-all;}
  .filebtn{display:inline-flex; align-items:center; gap:6px; background:#F3EEE0; border:1px solid var(--line); border-radius:9px; padding:7px 11px; font-size:13px; font-weight:600; color:var(--ink); margin:4px 0; max-width:100%;}
  .filebtn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rec{font-family:inherit;}
  .rec.on{background:#FBE9E5; border-color:#C9503B; color:#A33A2B;}
  audio{max-width:100%;}
  .empty{text-align:center; color:#6B6558; padding:30px 10px;}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>Community</h1>
  <p>Study together. Ask questions, share what you learn, and help each other.</p>
  <a href="skillstream-home.html">&larr; Home</a>
</header>

<div class="wrap">
  <!-- GROUP LIST -->
  <div id="listView">
    <div class="row"><h2>Study groups</h2><button class="btn small" id="newBtn" type="button">Create a group</button></div>
    <form class="box" id="newForm">
      <input type="text" id="gName" maxlength="60" placeholder="Group name">
      <input type="text" id="gTopic" maxlength="40" placeholder="Topic (e.g. Math, English)">
      <textarea id="gDesc" maxlength="400" placeholder="What is this group about? (optional)"></textarea>
      <div style="display:flex;gap:8px"><button class="btn" id="gSave" type="submit">Create</button><button class="btn ghost" id="gCancel" type="button">Cancel</button></div>
      <div class="msg" id="gMsg"></div>
    </form>
    <div id="groups"><div class="empty">Loading…</div></div>
  </div>

  <!-- ONE GROUP -->
  <div id="groupView" style="display:none">
    <div class="row">
      <button class="btn ghost small" id="backBtn" type="button">&larr; All groups</button>
      <button class="btn ghost small" id="leaveBtn" type="button">Leave group</button>
    </div>
    <h2 id="gTitle" data-no-i18n style="margin:4px 0"></h2>
    <div class="desc" id="gAbout" data-no-i18n></div>
    <div class="note">Be kind and respectful. Links are not allowed.</div>
    <form class="box show" id="postForm">
      <textarea id="postBody" maxlength="2000" placeholder="Write a post or ask a question…"></textarea>
      <div class="attach"><label class="pick" for="postFile">📎 <span>Attach a file</span></label><input type="file" id="postFile" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.docx,.xlsx,.pptx,.mp3,.m4a"><span class="chosen" id="postChosen" data-no-i18n></span></div>
      <div class="attach" id="postRec"></div>
      <button class="btn" id="postBtn" type="submit">Post</button>
      <div class="msg" id="pMsg"></div>
    </form>
    <div id="feed"></div>
  </div>
</div>

<script src="js/msgtabs.js" defer></script>
<script src="js/nav.js" defer></script>
<script>
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const T = s => (window.LNE_I18N && LNE_I18N.t) ? LNE_I18N.t(s) : s;
let me = null, current = null, myRole = null, isAdmin = false, modFlag = false;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
const KNOWN = ['Links are not allowed in group posts.','You are posting too fast. Please try again later.','This group is full.','You can own at most 5 groups.','Invalid attachment.'];
function friendly(e){
  const m = (e && e.message) || '';
  return KNOWN.indexOf(m) >= 0 ? m : 'Something went wrong. Please try again.';
}
function say(id, text, kind){ const el = $(id); el.className = 'msg' + (kind ? ' ' + kind : ''); el.textContent = text || ''; }

/* ---------- files ---------- */
const MAX_BYTES = 5 * 1024 * 1024;
const EXT_TYPES = { pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif', txt:'text/plain',
  webm:'audio/webm', m4a:'audio/mp4', ogg:'audio/ogg', mp3:'audio/mpeg',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation' };
function fileTypeOf(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const byExt = EXT_TYPES[ext];
  if(!byExt) return null;
  return byExt;   // the type is decided by the extension we allow, not by what the browser claims
}
function checkFile(f){
  if(!f) return null;
  if(f.size <= 0 || f.size > MAX_BYTES) return 'File is too large (max 5 MB).';
  if(!fileTypeOf(f)) return 'This file type is not allowed. Use PDF, images, Word, Excel, PowerPoint or text.';
  return null;
}
function sizeText(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
async function uploadFile(f){
  const type = fileTypeOf(f);
  const ext = (f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const base = f.name.replace(/\.[^.]*$/, '').replace(/[^A-Za-z0-9_-]+/g, '_').slice(0, 40) || 'file';
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  const path = current.id + '/' + me.id + '/' + id + '-' + base + '.' + ext;
  const up = await sb.storage.from('group-files').upload(path, f, { contentType: type, upsert: false });
  if(up.error) throw up.error;
  return { file_path: path, file_name: f.name.slice(0, 120), file_type: type, file_size: f.size };
}
/* ---------- voice recorder ---------- */
const MAX_SECONDS = 120;
function makeRecorder(host){
  const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  host.innerHTML = canRec
    ? '<button type="button" class="pick rec">🎤 <span>Record a voice message</span></button> <span class="chosen rstat" data-no-i18n></span> <button type="button" class="link rcancel" style="display:none">Remove</button><audio controls class="rprev" style="display:none;width:100%;margin-top:8px"></audio>'
    : '';
  const st = { file: null };
  if(!canRec) return { get: () => null, reset(){} };
  const btn = host.querySelector('.rec'), stat = host.querySelector('.rstat'), rm = host.querySelector('.rcancel'), prev = host.querySelector('.rprev');
  let mr = null, chunks = [], timer = null, t0 = 0, stream = null;
  const label = t => { btn.querySelector('span').textContent = T(t); };
  const clock = () => { const s = Math.floor((Date.now() - t0) / 1000); stat.textContent = T('Recording…') + ' ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if(s >= MAX_SECONDS) stop(); };
  function reset(){
    st.file = null; prev.style.display = 'none'; try { URL.revokeObjectURL(prev.src); } catch(e) {} prev.removeAttribute('src');
    rm.style.display = 'none'; stat.textContent = ''; btn.classList.remove('on'); label('Record a voice message');
  }
  function stop(){ if(mr && mr.state === 'recording') mr.stop(); }
  btn.onclick = async () => {
    if(mr && mr.state === 'recording'){ stop(); return; }
    reset();
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(e){ stat.textContent = T('Microphone access was blocked. Allow the microphone in your browser settings.'); return; }
    const pref = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
    mr = pref ? new MediaRecorder(stream, { mimeType: pref }) : new MediaRecorder(stream);
    chunks = [];
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(timer); stream.getTracks().forEach(x => x.stop());
      const type = (mr.mimeType || pref || 'audio/webm').split(';')[0];
      const ext = type === 'audio/mp4' ? 'm4a' : type === 'audio/ogg' ? 'ogg' : 'webm';
      const blob = new Blob(chunks, { type });
      btn.classList.remove('on'); label('Record a voice message');
      if(!blob.size){ stat.textContent = ''; return; }
      st.file = new File([blob], 'Voice message.' + ext, { type });
      prev.src = URL.createObjectURL(blob); prev.style.display = 'block'; rm.style.display = ''; stat.textContent = '';
    };
    mr.start(); t0 = Date.now(); btn.classList.add('on'); label('Stop'); clock(); timer = setInterval(clock, 500);
  };
  rm.onclick = reset;
  return { get: () => st.file, reset };
}
function isVoice(f){ return f && f.file_type && f.file_type.indexOf('audio/') === 0; }

async function openFile(path){
  const w = window.open('', '_blank');
  const r = await sb.storage.from('group-files').createSignedUrl(path, 120);
  if(r.error || !r.data){ if(w) w.close(); alert(T('Could not open the file. Please try again.')); return; }
  if(w) w.location.href = r.data.signedUrl; else window.location.href = r.data.signedUrl;
}

/* ---------- list ---------- */
async function loadGroups(){
  const { data, error } = await sb.rpc('list_study_groups');
  const el = $('groups');
  if(error){ el.innerHTML = '<div class="empty">Something went wrong. Please try again.</div>'; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">No groups yet. Be the first to create one!</div>'; return; }
  el.innerHTML = data.map(g => {
    const n = Number(g.member_count);
    return '<div class="card">' +
      (g.topic ? '<div class="topic" data-no-i18n>' + esc(g.topic) + '</div>' : '') +
      '<h3 data-no-i18n>' + esc(g.name) + '</h3>' +
      (g.description ? '<div class="desc" data-no-i18n>' + esc(g.description) + '</div>' : '') +
      '<div class="meta"><span>' + (n === 1 ? '1 member' : n + ' members') + '</span> · <span>by</span> <span data-no-i18n>' + esc(g.owner_name) + '</span></div>' +
      '<div class="actions">' + (g.is_member
         ? '<button class="btn small" data-open="' + g.id + '" type="button">Open</button>'
         : '<button class="btn small" data-join="' + g.id + '" type="button">Join</button>') + '</div></div>';
  }).join('');
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openGroup(b.dataset.open, data));
  el.querySelectorAll('[data-join]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const r = await sb.rpc('join_study_group', { p_group: b.dataset.join });
    if(r.error){ alert(T(friendly(r.error))); b.disabled = false; return; }
    const fresh = await sb.rpc('list_study_groups');
    openGroup(b.dataset.join, fresh.data || data);
  });
}

$('newBtn').onclick = () => { $('newForm').classList.toggle('show'); say('gMsg',''); };
$('gCancel').onclick = () => $('newForm').classList.remove('show');
$('newForm').onsubmit = async ev => {
  ev.preventDefault();
  const name = $('gName').value.trim();
  if(name.length < 3 || name.length > 60){ say('gMsg', 'Group name must be 3 to 60 characters.', 'err'); return; }
  $('gSave').disabled = true;
  const { error } = await sb.rpc('create_study_group', { p_name: name, p_description: $('gDesc').value, p_topic: $('gTopic').value });
  $('gSave').disabled = false;
  if(error){ say('gMsg', friendly(error), 'err'); return; }
  $('gName').value = $('gTopic').value = $('gDesc').value = '';
  $('newForm').classList.remove('show'); say('gMsg','');
  loadGroups();
};

/* ---------- one group ---------- */
async function openGroup(id, groups){
  const g = (groups || []).find(x => x.id === id);
  if(!g) return;
  current = g; myRole = g.my_role;
  $('listView').style.display = 'none'; $('groupView').style.display = 'block';
  $('gTitle').textContent = g.name; $('gAbout').textContent = g.description || '';
  $('leaveBtn').style.display = g.my_role === 'owner' ? 'none' : '';
  window.scrollTo(0, 0);
  await loadFeed();
}
$('backBtn').onclick = () => { $('groupView').style.display = 'none'; $('listView').style.display = 'block'; current = null; loadGroups(); };
$('leaveBtn').onclick = async () => {
  if(!confirm(T('Leave this group?'))) return;
  const r = await sb.from('study_group_members').delete().eq('group_id', current.id).eq('user_id', me.id);
  if(r.error){ alert(T(friendly(r.error))); return; }
  $('backBtn').onclick();
};

async function loadFeed(){
  const { data, error } = await sb.rpc('group_feed', { p_group: current.id });
  const el = $('feed');
  if(error){ el.innerHTML = '<div class="empty">Something went wrong. Please try again.</div>'; return; }
  const rows = data || []; window.__feedRows = rows;
  const tops = rows.filter(r => !r.parent_id), kids = {};
  rows.filter(r => r.parent_id).forEach(r => (kids[r.parent_id] = kids[r.parent_id] || []).push(r));
  if(!tops.length){ el.innerHTML = '<div class="empty">No posts yet. Start the conversation!</div>'; return; }
  const one = (p, isReply) =>
    '<div class="post' + (isReply ? ' reply' : '') + (p.hidden ? ' isHidden' : '') + '">' +
      '<div><span class="who" dir="auto" data-no-i18n>' + esc(p.author_name) + '</span>' + (p.author_role === 'teacher' ? '<span class="badge">Teacher</span>' : '') + '</div>' +
      (p.hidden ? '<div class="hiddenNote">Hidden by a moderator</div>' : '') +
      (p.file_path && (p.body === '📎' || p.body === '🎤') ? '' : '<div class="body" dir="auto" data-no-i18n>' + esc(p.body) + '</div>') +
      (p.file_path && isVoice(p) ? '<div class="voice"><button class="filebtn" data-audio="' + esc(p.file_path) + '" type="button">▶ <span>Play voice message</span> <span class="meta" data-no-i18n>' + sizeText(p.file_size || 0) + '</span></button></div>' : '') +
      (p.file_path && !isVoice(p) ? '<div><button class="filebtn" data-file="' + esc(p.file_path) + '" type="button">📎 <span data-no-i18n>' + esc(p.file_name || 'file') + '</span> <span class="meta" data-no-i18n>' + sizeText(p.file_size || 0) + '</span></button></div>' : '') +
      '<div class="tools">' +
        (!isReply ? '<button class="link" data-reply="' + p.id + '" type="button">Reply</button>' : '') +
        (p.author_id !== me.id ? '<button class="link" data-report="' + p.id + '" type="button">Report</button>' : '') +
        (current.my_role === 'owner' || isAdmin || modFlag ? '<button class="link" data-hide="' + p.id + '" data-to="' + (p.hidden ? 'false' : 'true') + '" type="button">' + (p.hidden ? 'Show' : 'Hide') + '</button>' : '') +
        (p.author_id === me.id || current.my_role === 'owner' || isAdmin || modFlag ? '<button class="link" data-del="' + p.id + '" type="button">Delete</button>' : '') +
        (p.report_count > 0 ? '<span class="meta">' + p.report_count + ' reports</span>' : '') +
      '</div>' +
      (isReply ? '' : '<div id="rbox-' + p.id + '"></div>') +
    '</div>';
  el.innerHTML = tops.map(p => one(p, false) + (kids[p.id] || []).map(k => one(k, true)).join('')).join('');
  wire(el);
}
function wire(el){
  el.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => {
    const box = $('rbox-' + b.dataset.reply);
    if(box.innerHTML){ box.innerHTML = ''; return; }
    box.innerHTML = '<form style="margin-top:8px"><textarea maxlength="2000" placeholder="' + esc(T('Write a reply…')) + '" style="min-height:60px"></textarea><div class="attach"><label class="pick">📎 <span>' + esc(T('Attach a file')) + '</span><input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.docx,.xlsx,.pptx,.mp3,.m4a"></label><span class="chosen" data-no-i18n></span></div><div class="attach rhost"></div><button class="btn small" type="submit">Reply</button><div class="msg"></div></form>';
    const f = box.querySelector('form');
    f._rec = makeRecorder(f.querySelector('.rhost'));
    f.querySelector('input[type=file]').onchange = ev => { const x = ev.target.files[0]; f.querySelector('.chosen').textContent = x ? x.name : ''; };
    f.onsubmit = async ev => {
      ev.preventDefault();
      const fi = f.querySelector('input[type=file]'), voice = f._rec && f._rec.get(), file = voice || fi.files[0] || null, m = f.querySelector('.msg');
      let body = f.querySelector('textarea').value.trim();
      if(!body && !file) return;
      const bad = checkFile(file); if(bad){ m.className = 'msg err'; m.textContent = T(bad); return; }
      const sub = f.querySelector('button[type=submit]'); sub.disabled = true;
      let meta = {}, up = null;
      try { if(file){ m.className = 'msg'; m.textContent = T('Uploading…'); meta = await uploadFile(file); up = meta.file_path; if(!body) body = voice ? '🎤' : '📎'; } }
      catch(e){ sub.disabled = false; m.className = 'msg err'; m.textContent = T('Could not upload the file. Please try again.'); return; }
      const r = await sb.from('group_posts').insert(Object.assign({ group_id: current.id, author_id: me.id, parent_id: b.dataset.reply, body }, meta));
      sub.disabled = false;
      if(r.error){ if(up){ try { await sb.storage.from('group-files').remove([up]); } catch(e) {} } m.className = 'msg err'; m.textContent = T(friendly(r.error)); return; }
      loadFeed();
    };
  });
  el.querySelectorAll('[data-audio]').forEach(b => b.onclick = async () => {
    const r = await sb.storage.from('group-files').createSignedUrl(b.dataset.audio, 900);
    if(r.error || !r.data){ alert(T('Could not open the file. Please try again.')); return; }
    const a = document.createElement('audio'); a.controls = true; a.autoplay = true; a.src = r.data.signedUrl; a.style.width = '100%';
    b.parentNode.replaceChild(a, b);
  });
  el.querySelectorAll('[data-file]').forEach(b => b.onclick = () => openFile(b.dataset.file));
  el.querySelectorAll('[data-report]').forEach(b => b.onclick = async () => {
    const r = await sb.from('group_post_reports').insert({ post_id: b.dataset.report, reporter_id: me.id });
    if(r.error && r.error.code === '23505'){ alert(T('You already reported this.')); return; }
    if(r.error){ alert(T(friendly(r.error))); return; }
    alert(T('Thanks, your report was sent.'));
  });
  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    const r = await sb.rpc('hide_group_post', { p_post: b.dataset.hide, p_hide: b.dataset.to === 'true' });
    if(r.error){ alert(T(friendly(r.error))); return; }
    loadFeed();
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm(T('Delete this post?'))) return;
    const r = await sb.from('group_posts').delete().eq('id', b.dataset.del);
    if(r.error){ alert(T(friendly(r.error))); return; }
    const gone = (window.__feedRows || []).find(x => x.id === b.dataset.del);
    if(gone && gone.file_path){ try { await sb.storage.from('group-files').remove([gone.file_path]); } catch(e) {} }
    loadFeed();
  });
}

const postRec = makeRecorder($('postRec'));
$('postFile').onchange = () => { const x = $('postFile').files[0]; $('postChosen').textContent = x ? x.name : ''; };
$('postForm').onsubmit = async ev => {
  ev.preventDefault();
  const voice = postRec.get(), file = voice || $('postFile').files[0] || null;
  let body = $('postBody').value.trim(); if(!body && !file) return;
  const bad = checkFile(file); if(bad){ say('pMsg', T(bad), 'err'); return; }
  $('postBtn').disabled = true;
  let meta = {}, up = null;
  try { if(file){ say('pMsg', T('Uploading…')); meta = await uploadFile(file); up = meta.file_path; if(!body) body = voice ? '🎤' : '📎'; } }
  catch(e){ $('postBtn').disabled = false; say('pMsg', T('Could not upload the file. Please try again.'), 'err'); return; }
  const r = await sb.from('group_posts').insert(Object.assign({ group_id: current.id, author_id: me.id, body }, meta));
  $('postBtn').disabled = false;
  if(r.error){ if(up){ try { await sb.storage.from('group-files').remove([up]); } catch(e) {} } say('pMsg', T(friendly(r.error)), 'err'); return; }
  $('postBody').value = ''; $('postFile').value = ''; postRec.reset(); $('postChosen').textContent = ''; say('pMsg','');
  loadFeed();
};

(async function init(){
  const s = await sb.auth.getSession();
  const session = s && s.data && s.data.session;
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  me = session.user;
  document.querySelectorAll('textarea').forEach(a => { a.placeholder = T(a.getAttribute('placeholder') || ''); });
  try {
    const p = await sb.from('profiles').select('role').eq('id', me.id).maybeSingle();
    const role = p && p.data && p.data.role;
    isAdmin = role === 'admin'; modFlag = role === 'admin' || role === 'teacher';
  } catch(e) {}
  loadGroups();
})();
</script>
