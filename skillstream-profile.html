<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/incentives.js"></script>
<style>
  :root{
    --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --gold-light:#E4C583; --cream:#FBF7EF; --sage:#6B8F71;
    --charcoal:#2B2B2B; --line:#E9E2D2; --danger:#B5533C;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); padding-bottom:60px;}
  h1,h2,h3,.display{font-family:'Syne',sans-serif;}
  button, a, .btn, .course-card, .chip{ transition:transform 0.18s cubic-bezier(.22,1,.36,1), box-shadow 0.18s cubic-bezier(.22,1,.36,1); }
  button:active, a.btn:active, .btn:active, .course-card:active{ transform:scale(0.97); }

  header.top{background:linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%); color:var(--cream); padding:22px 18px 60px; position:relative;}
  header.top .eyebrow{font-size:14.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:4px; font-weight:700;}
  header.top h1{margin:0; font-size:25px;}

  .wrap{padding:0 18px;}

  .avatar-card{
    background:#fff; border-radius:18px; padding:20px;
    margin-top:-42px; box-shadow:0 6px 18px rgba(27,42,74,0.08);
    text-align:center; margin-bottom:22px;
  }
  .avatar{
    width:78px; height:78px; border-radius:50%; background:var(--gold);
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
    font-family:'Syne',sans-serif; font-size:28px; font-weight:700; color:var(--ink);
    overflow:hidden; border:3px solid #fff; box-shadow:0 0 0 3px var(--line);
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .name{font-size:19px; font-weight:700; color:var(--ink);}
  .role-badge{
    display:inline-block; margin-top:6px; font-size:14px; font-weight:700;
    letter-spacing:0.5px; text-transform:uppercase; padding:4px 12px; border-radius:20px;
  }
  .role-badge.student{background:#EAF0EC; color:var(--sage);}
  .role-badge.teacher{background:#F5EAD6; color:var(--gold);}
  .bio-text{font-size:17px; color:#666; margin-top:10px; line-height:1.5;}

  .stats-row{display:flex; gap:10px; margin-bottom:22px;}
  .stat{flex:1; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center;}
  .stat .val{font-family:'Inter',sans-serif; font-size:26px; font-weight:700; color:var(--ink); line-height:1.1; letter-spacing:-0.5px;}
  .stat .lbl{font-size:15.5px; color:#777; margin-top:4px;}

  .portfolio-subhead{font-size:14px; text-transform:uppercase; letter-spacing:1px; color:#a8a094; margin:14px 0 8px;}
  .portfolio-subhead:first-child{margin-top:0;}
  .portfolio-item{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .portfolio-item .p-title{font-weight:700; color:var(--ink); font-size:17px;}
  .portfolio-item .p-meta{font-size:15px; color:#8a8474; margin-top:2px;}
  .portfolio-item .p-response{font-size:16.5px; color:#5c5648; margin-top:6px; line-height:1.5;}
  .portfolio-item a.p-link{font-size:15.5px; color:var(--ink); font-weight:600; margin-top:6px; display:inline-block;}
  .portfolio-empty{font-size:16px; color:#999; padding:6px 2px 10px;}

  .badge-grid{
    display:flex; flex-wrap:wrap; gap:9px; margin-bottom:22px;
  }
  .achievement-badge{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:#fff; border-radius:14px; padding:12px 8px; width:92px; text-align:center;
    box-shadow:0 2px 10px rgba(20,31,56,0.06);
  }
  .achievement-badge.locked{opacity:0.4;}
  .achievement-badge .icon{font-size:22px;}
  .achievement-badge .label{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.25;}

  .section-title{
    font-size:14.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold);
    font-weight:700; margin-bottom:12px;
  }
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:20px;}

  label{display:block; font-size:16.5px; font-weight:600; margin:14px 0 6px; color:var(--ink);}
  label:first-child{margin-top:0;}
  input, textarea{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px;
    font-size:16.5px; font-family:'Inter',sans-serif; background:#fdfcfa;
  }
  textarea{min-height:80px; resize:vertical;}

  .btn{
    display:block; width:100%; text-align:center; background:var(--ink); color:#fff;
    border:none; padding:13px 18px; border-radius:10px; font-size:16.5px; font-weight:700;
    cursor:pointer; margin-top:16px;
  }
  .btn.outline{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:30px;
    font-size:16.5px; z-index:100; display:none;
  }
  .loading{text-align:center; padding:30px; color:#888;}

  .live-clock-badge{
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12);
    color:var(--gold-light); font-size:14.5px; font-weight:700; padding:5px 12px; border-radius:20px;
    margin-top:10px; font-variant-numeric:tabular-nums; letter-spacing:0.3px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>My Profile</h1>
  <div class="live-clock-badge" id="liveClockBadge">🕐 --:--:--</div>
</header>

<div class="wrap">
  <div class="avatar-card" id="avatarCard"><div class="loading">Loading profile…</div></div>

  <div class="stats-row" id="statsRow"></div>

  <div class="section-title" id="goalTitle" style="display:none;">Learning Goal</div>
  <div class="card" id="goalCard" style="display:none; padding:14px 16px; margin-bottom:16px;">
    <div id="goalView"></div>
    <div id="goalForm" style="display:none; margin-top:10px;">
      <label>What do you want to learn?</label>
      <input type="text" id="goalSubject" placeholder="e.g. Learn Python">
      <label style="margin-top:8px; display:block;">Target (optional)</label>
      <input type="text" id="goalTarget" placeholder="e.g. Build a small project">
      <label style="margin-top:8px; display:block;">Deadline (optional)</label>
      <input type="date" id="goalDeadline">
      <button class="btn-primary" style="margin-top:10px;" onclick="saveGoal()">Save Goal</button>
    </div>
  </div>

  <div class="section-title" id="achievementsTitle" style="display:none;">Achievements</div>
  <div class="badge-grid" id="achievementsGrid"></div>

  <div class="section-title" id="portfolioTitle" style="display:none;">Portfolio — What I Can Do</div>
  <div id="portfolioContent"></div>

  <div class="section-title" id="feedbackTitle" style="display:none;">Feedback From Your Teachers</div>
  <div id="feedbackList"></div>

  <div class="section-title">Edit Profile</div>
  <div class="card">
    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Your name">
    <label>Bio</label>
    <textarea id="bio" placeholder="A short line about you — your interests, what you teach or want to learn"></textarea>

    <div id="gradeLevelField" style="display:none;">
      <label>Grade / Class Level</label>
      <select id="gradeLevel">
        <option value="">Not set</option>
        <option value="kg">Kindergarten</option>
        <option value="grade_1">Grade 1</option>
        <option value="grade_2">Grade 2</option>
        <option value="grade_3">Grade 3</option>
        <option value="grade_4">Grade 4</option>
        <option value="grade_5">Grade 5</option>
        <option value="grade_6">Grade 6</option>
        <option value="grade_7">Grade 7</option>
        <option value="grade_8">Grade 8</option>
        <option value="grade_9">Grade 9</option>
        <option value="grade_10">Grade 10</option>
        <option value="grade_11">Grade 11</option>
        <option value="grade_12">Grade 12</option>
        <option value="university">University</option>
      </select>
    </div>

    <label>Profile Photo</label>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;">
      <input type="file" id="avatarFile" accept="image/*" style="flex:1;" onchange="uploadAvatar()">
    </div>
    <div id="avatarUploadStatus" style="font-size:14.5px; color:#8a8474; margin-bottom:10px;"></div>
    <input type="hidden" id="avatarUrl">
    <button class="btn" onclick="saveProfile()">Save Changes</button>
  </div>

  <div class="section-title">Account</div>
  <div class="card">
    <button class="btn outline" onclick="signOut()">Log Out</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   CONFIG — REQUIRED — same project as your other SkillStream pages
   ==================================================================== */
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentProfile = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2200);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  currentUser = session.user;
  loadProfile();

  sb.auth.onAuthStateChange((event, session)=>{
    if(!session){ window.location.href = 'skillstream-login.html'; }
  });
}

async function loadProfile(){
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if(error){
    document.getElementById('avatarCard').innerHTML = `<div class="loading">Couldn't load profile.<br><small>${error.message}</small></div>`;
    return;
  }
  currentProfile = profile || { id: currentUser.id, full_name: currentUser.email, role: 'student' };
  renderProfile();
  loadStats();

  document.getElementById('fullName').value = currentProfile.full_name || '';
  document.getElementById('bio').value = currentProfile.bio || '';
  document.getElementById('avatarUrl').value = currentProfile.avatar_url || '';

  if((currentProfile.role || 'student') === 'student'){
    document.getElementById('gradeLevelField').style.display = 'block';
    document.getElementById('gradeLevel').value = currentProfile.grade_level || '';
  }
}

function renderProfile(){
  const initials = (currentProfile.full_name || currentUser.email || '?').trim().charAt(0).toUpperCase();
  const role = currentProfile.role || 'student';
  document.getElementById('avatarCard').innerHTML = `
    <div class="avatar">
      ${currentProfile.avatar_url ? `<img src="${currentProfile.avatar_url}">` : initials}
    </div>
    <div class="name">${escapeHtml(currentProfile.full_name || currentUser.email)}</div>
    <span class="role-badge ${role}">${role === 'teacher' ? 'Teacher' : 'Student'}</span>
    ${currentProfile.bio ? `<div class="bio-text">${escapeHtml(currentProfile.bio)}</div>` : ''}
  `;
}

async function loadStats(){
  const role = currentProfile.role || 'student';
  const statsEl = document.getElementById('statsRow');

  if(role === 'teacher'){
    const { data: courses } = await sb.from('courses').select('id, is_published').eq('teacher_id', currentUser.id);
    const total = (courses || []).length;
    const published = (courses || []).filter(c => c.is_published).length;
    statsEl.innerHTML = `
      <div class="stat"><div class="val">${total}</div><div class="lbl">Courses</div></div>
      <div class="stat"><div class="val">${published}</div><div class="lbl">Published</div></div>
    `;
  } else {
    const [{ data: progress }, { data: certs }] = await Promise.all([
      sb.from('lesson_progress').select('lesson_id, completed').eq('user_id', currentUser.id).eq('completed', true),
      sb.from('certificates').select('id, issued_at, courses(title)').eq('user_id', currentUser.id)
    ]);
    const lessonsDone = (progress||[]).length;
    const certsEarned = (certs||[]).length;
    statsEl.innerHTML = `
      <div class="stat"><div class="val">${lessonsDone}</div><div class="lbl">Lessons Done</div></div>
      <div class="stat"><div class="val">${certsEarned}</div><div class="lbl">Certificates</div></div>
    `;
    renderAchievements();
    loadGoal();
    loadTeacherFeedback();
    loadPortfolio(certs || []);
  }
}

/* ---------- PORTFOLIO ("what can this learner actually do") ----------
   Pulls together certificates, Project Showcase entries, and completed
   challenge responses into one view — the three places real demonstrated
   work already lives — instead of a fourth new table. */
async function loadPortfolio(certs){
  const [{ data: projects }, { data: challengeRows }] = await Promise.all([
    sb.from('projects').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false }),
    sb.from('challenge_progress').select('*, challenges(title, type)').eq('user_id', currentUser.id)
      .eq('status', 'completed').order('completed_at', { ascending:false })
  ]);

  const hasAny = certs.length || (projects && projects.length) || (challengeRows && challengeRows.length);
  document.getElementById('portfolioTitle').style.display = hasAny ? 'block' : 'none';
  if(!hasAny){ document.getElementById('portfolioContent').innerHTML = ''; return; }

  let html = '';

  if(certs.length){
    html += `<div class="portfolio-subhead">Certificates</div>`;
    html += certs.map(c => `
      <div class="portfolio-item">
        <div class="p-title">${escapeHtml(c.courses?.title || 'Course')}</div>
        <div class="p-meta">Issued ${new Date(c.issued_at).toLocaleDateString()}</div>
      </div>
    `).join('');
  }

  html += `<div class="portfolio-subhead">Projects</div>`;
  if(projects && projects.length){
    html += projects.map(p => `
      <div class="portfolio-item">
        <div class="p-title">${escapeHtml(p.title)}</div>
        ${p.subject ? `<div class="p-meta">${escapeHtml(p.subject)}</div>` : ''}
        ${p.description ? `<div class="p-response">${escapeHtml(p.description)}</div>` : ''}
        <a class="p-link" href="skillstream-showcase.html">View in Showcase &rarr;</a>
      </div>
    `).join('');
  } else {
    html += `<div class="portfolio-empty">No projects shared yet.</div>
      <a class="p-link" href="skillstream-showcase.html">+ Share a Project</a>`;
  }

  if(challengeRows && challengeRows.length){
    html += `<div class="portfolio-subhead">Completed Challenges</div>`;
    html += challengeRows.map(c => `
      <div class="portfolio-item">
        <div class="p-title">${escapeHtml(c.challenges?.title || 'Challenge')}</div>
        ${c.response ? `<div class="p-response">${escapeHtml(c.response)}</div>` : ''}
      </div>
    `).join('');
  }

  document.getElementById('portfolioContent').innerHTML = html;
}

/* ---------- ACHIEVEMENTS (DB-backed — see achievements/user_achievements) ---------- */
async function renderAchievements(){
  const [{ data: all }, { data: earned }] = await Promise.all([
    sb.from('achievements').select('code, title, icon, sort_order').order('sort_order'),
    sb.from('user_achievements').select('achievements(code)').eq('user_id', currentUser.id)
  ]);

  const earnedCodes = new Set((earned || []).map(e => e.achievements?.code).filter(Boolean));
  const badges = (all || []).map(a => ({ icon: a.icon, label: a.title, unlocked: earnedCodes.has(a.code) }));

  const anyUnlocked = badges.some(b => b.unlocked);
  document.getElementById('achievementsTitle').style.display = anyUnlocked ? 'block' : 'none';

  document.getElementById('achievementsGrid').innerHTML = badges.map(b => `
    <div class="achievement-badge ${b.unlocked ? '' : 'locked'}">
      <div class="icon">${b.icon}</div>
      <div class="label">${escapeHtml(b.label)}</div>
    </div>
  `).join('');
}

/* ---------- LEARNING GOAL ---------- */
async function loadGoal(){
  const { data: goal } = await sb.from('learning_goals').select('*')
    .eq('user_id', currentUser.id).eq('status', 'active')
    .order('created_at', { ascending:false }).limit(1).maybeSingle();

  document.getElementById('goalTitle').style.display = 'block';
  document.getElementById('goalCard').style.display = 'block';
  const view = document.getElementById('goalView');
  const form = document.getElementById('goalForm');

  if(goal){
    view.innerHTML = `
      <div style="font-weight:700; color:var(--ink);">${escapeHtml(goal.subject)}</div>
      ${goal.target ? `<div style="font-size:16.5px; color:#777; margin-top:3px;">${escapeHtml(goal.target)}</div>` : ''}
      ${goal.deadline ? `<div style="font-size:15.5px; color:#999; margin-top:3px;">Target date: ${goal.deadline}</div>` : ''}
      <button class="btn-primary" style="margin-top:10px;" onclick="markGoalComplete('${goal.id}')">Mark Goal Complete</button>
    `;
    view.style.display = 'block';
    form.style.display = 'none';
  } else {
    view.innerHTML = `<div style="color:#777; font-size:17px;">No active goal yet — set one to keep your learning focused.</div>`;
    view.style.display = 'block';
    form.style.display = 'block';
  }
}

async function saveGoal(){
  const subject = document.getElementById('goalSubject').value.trim();
  if(!subject){ alert('Tell us what you want to learn first.'); return; }
  const target = document.getElementById('goalTarget').value.trim();
  const deadline = document.getElementById('goalDeadline').value || null;

  const { error } = await sb.from('learning_goals').insert({
    user_id: currentUser.id, subject, target: target || null, deadline
  });
  if(error){ alert('Error: ' + error.message); return; }
  loadGoal();
}

async function markGoalComplete(goalId){
  const { error } = await sb.from('learning_goals')
    .update({ status: 'completed', completed_at: new Date().toISOString() })
    .eq('id', goalId).eq('user_id', currentUser.id);
  if(error){ alert('Error: ' + error.message); return; }
  loadGoal();
  if(window.Incentives){
    Incentives.checkAchievements(sb).then(earned => Incentives.showToasts(earned));
  }
}

/* ---------- FEEDBACK FROM TEACHERS ---------- */
async function loadTeacherFeedback(){
  const { data: rows } = await sb.from('teacher_feedback')
    .select('*, courses(title)').eq('student_id', currentUser.id)
    .order('created_at', { ascending:false }).limit(10);

  const title = document.getElementById('feedbackTitle');
  const list = document.getElementById('feedbackList');
  if(!rows || rows.length === 0){ title.style.display = 'none'; list.innerHTML = ''; return; }

  const teacherIds = Array.from(new Set(rows.map(r => r.teacher_id)));
  const { data: teachers } = await sb.from('profiles').select('id, full_name').in('id', teacherIds);
  const nameById = {};
  (teachers || []).forEach(t => { nameById[t.id] = t.full_name || 'Your teacher'; });

  title.style.display = 'block';
  list.innerHTML = rows.map(r => `
    <div class="card" style="padding:14px 16px; margin-bottom:10px;">
      <div style="font-weight:700; color:var(--ink); font-size:17px;">${escapeHtml(nameById[r.teacher_id])}${r.courses?.title ? ' &middot; ' + escapeHtml(r.courses.title) : ''}</div>
      <div style="font-size:17px; margin-top:4px;">${escapeHtml(r.message)}</div>
      <div style="font-size:14.5px; color:#999; margin-top:6px;">${new Date(r.created_at).toLocaleDateString()}</div>
    </div>
  `).join('');
}

/* ---------- AVATAR UPLOAD ----------
   Uploads directly to Supabase Storage (bucket: "avatars") instead of
   requiring a pasted URL. Requires the bucket to exist with public
   read access — see setup note below the code. */
async function uploadAvatar(){
  const fileInput = document.getElementById('avatarFile');
  const file = fileInput.files[0];
  if(!file) return;

  const status = document.getElementById('avatarUploadStatus');
  status.textContent = 'Uploading…';

  const path = `avatars/${currentUser.id}/${Date.now()}_${file.name}`;

  try{
    const { error: uploadError } = await sb.storage.from('skillstream-files').upload(path, file, { upsert: true });
    if(uploadError) throw uploadError;

    const { data: urlData } = sb.storage.from('skillstream-files').getPublicUrl(path);
    document.getElementById('avatarUrl').value = urlData.publicUrl;
    status.textContent = 'Photo ready — tap "Save Changes" below to apply it.';
  } catch(err){
    status.textContent = 'Upload failed: ' + err.message;
  }
}

async function saveProfile(){
  const payload = {
    id: currentUser.id,
    full_name: document.getElementById('fullName').value.trim(),
    bio: document.getElementById('bio').value.trim(),
    avatar_url: document.getElementById('avatarUrl').value.trim(),
    role: currentProfile.role || 'student'
  };
  if((currentProfile.role || 'student') === 'student'){
    payload.grade_level = document.getElementById('gradeLevel').value || null;
  }
  const { error } = await sb.from('profiles').upsert(payload, { onConflict: 'id' });
  if(error){ toast('Error: ' + error.message); return; }
  currentProfile = { ...currentProfile, ...payload };
  renderProfile();
  toast('Profile updated');
}

async function signOut(){
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

initAuth();
</script>

<script>
  function updateLiveClock(){
    var el = document.getElementById('liveClockBadge');
    if(!el) return;
    var now = new Date();
    var h = String(now.getHours()).padStart(2,'0');
    var m = String(now.getMinutes()).padStart(2,'0');
    var s = String(now.getSeconds()).padStart(2,'0');
    el.textContent = '🕐 ' + h + ':' + m + ':' + s;
  }
  updateLiveClock();
  setInterval(updateLiveClock, 1000);
</script>
</body>
</html>
