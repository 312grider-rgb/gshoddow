<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/i18n.js?v=1"></script>
<link href="css/rtl.css?v=2" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send feedback — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.5/dist/umd/supabase.js"></script>
<style>
  :root{ --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --cream:#FBF7EF; --line:#E9E2D2; --danger:#A33A2B; --muted:#6B6558; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:#2B2B2B; padding-bottom:96px;}
  h1,h2{font-family:'Fraunces',serif; color:var(--ink);}
  header.top{background:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 100%); color:var(--cream); padding:22px 18px;}
  header.top .eyebrow{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:4px; font-weight:700;}
  header.top h1{margin:0; font-size:24px; color:var(--cream);}
  header.top p{margin:8px 0 0; font-size:14px; color:rgba(251,247,239,.82); line-height:1.5;}
  .wrap{padding:14px; max-width:760px; margin:0 auto;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  label.f{display:block; font-size:13px; font-weight:700; margin:14px 0 6px; color:var(--ink);}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:9px 14px; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; min-height:40px;}
  .chip[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
  .stars .chip{min-width:44px; text-align:center; padding:9px 0;}
  textarea{width:100%; min-height:110px; border:1.5px solid var(--line); border-radius:10px; padding:12px; font:inherit; font-size:15px;}
  .btn{width:100%; border:0; border-radius:10px; padding:13px; font-weight:700; font-size:15px; cursor:pointer; background:var(--ink); color:#fff; margin-top:14px; font-family:inherit; min-height:46px;}
  .btn:disabled{opacity:.5;}
  .hint{font-size:13px; color:var(--muted); line-height:1.55;}
  .msg{font-size:13.5px; margin-top:10px; min-height:18px;} .msg.err{color:var(--danger);} .msg.ok{color:#3E6B48;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>Send feedback</h1>
  <p>Tell us what is hard, confusing or missing. Your words help us make this better for everyone.</p>
</header>
<div class="wrap">
  <div class="card">
    <p class="hint" style="margin:0">Our team can read your note, but it does not show your name or email.</p>
    <label class="f">What is it about?</label>
    <div class="chips" id="kinds" role="group" aria-label="What is it about?">
      <button class="chip" type="button" data-v="problem" aria-pressed="false">Something is broken</button>
      <button class="chip" type="button" data-v="confusing" aria-pressed="false">I am confused</button>
      <button class="chip" type="button" data-v="idea" aria-pressed="false">I have an idea</button>
      <button class="chip" type="button" data-v="other" aria-pressed="true">Something else</button>
    </div>
    <label class="f">How is the app for you so far?</label>
    <div class="chips stars" id="stars" role="group" aria-label="How is the app for you so far?">
      <button class="chip" type="button" data-v="1" aria-pressed="false">1</button>
      <button class="chip" type="button" data-v="2" aria-pressed="false">2</button>
      <button class="chip" type="button" data-v="3" aria-pressed="false">3</button>
      <button class="chip" type="button" data-v="4" aria-pressed="false">4</button>
      <button class="chip" type="button" data-v="5" aria-pressed="false">5</button>
    </div>
    <p class="hint" style="margin:6px 0 0">1 is poor, 5 is excellent. You can skip this.</p>
    <label class="f" for="fMsg">Your note</label>
    <textarea id="fMsg" maxlength="500"></textarea>
    <button class="btn" id="fSend" type="button">Send</button>
    <div class="msg" id="fMsgOut" role="status"></div>
  </div>
</div>
<script src="js/nav.js" defer></script>
<script>
const sb = window.supabase.createClient('https://vauudtedojtcveiqajlr.supabase.co', 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE');
const $ = id => document.getElementById(id);
const T = s => (window.LNE_I18N && LNE_I18N.t) ? LNE_I18N.t(s) : s;
let kind = 'other', rating = null;
function pick(boxId, cb){
  const btns = $(boxId).querySelectorAll('.chip');
  btns.forEach(b => b.onclick = () => {
    const was = b.getAttribute('aria-pressed') === 'true';
    btns.forEach(x => x.setAttribute('aria-pressed', 'false'));
    if(boxId === 'stars' && was){ cb(null); return; }
    b.setAttribute('aria-pressed', 'true'); cb(b.getAttribute('data-v'));
  });
}
pick('kinds', v => { kind = v; });
pick('stars', v => { rating = v ? parseInt(v, 10) : null; });
$('fSend').onclick = async () => {
  const m = $('fMsgOut'); m.className = 'msg'; m.textContent = '';
  const text = $('fMsg').value.trim();
  if(text.length < 3){ m.className = 'msg err'; m.textContent = T('Please write a few words.'); return; }
  $('fSend').disabled = true;
  const r = await sb.rpc('submit_feedback', { p_rating:rating, p_kind:kind, p_message:text, p_page:document.referrer ? (document.referrer.split('/').pop().split('?')[0].slice(0, 100) || null) : null });
  $('fSend').disabled = false;
  if(r.error){ m.className = 'msg err'; m.textContent = r.error.message || T('Something went wrong. Please try again.'); return; }
  $('fMsg').value = ''; m.className = 'msg ok'; m.textContent = T('Thank you! We read every note.');
};
(async function(){ const s = await sb.auth.getSession(); if(!(s.data && s.data.session)) window.location.href = 'skillstream-login.html'; })();
</script>
</body>
</html>
