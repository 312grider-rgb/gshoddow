<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --gold-light:#E4C583;
    --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2;
    --shadow-soft:0 2px 10px rgba(20,31,56,0.06);
    --shadow-card:0 8px 24px rgba(20,31,56,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); -webkit-font-smoothing:antialiased; padding-bottom:30px;}
  h1,h2,h3{font-family:'Syne',sans-serif;}

  header.top{background:linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%); color:var(--cream); padding:22px 20px 26px;}
  header.top .eyebrow{font-size:11.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; font-weight:600;}
  header.top h1{margin:0; font-size:24px;}

  .wrap{padding:18px;}

  .shelf-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .shelf-tab{
    flex:1; background:#fff; border:none; padding:12px; border-radius:12px;
    font-size:13.5px; font-weight:700; color:var(--ink); box-shadow:var(--shadow-soft);
  }
  .shelf-tab.active{background:var(--ink); color:var(--gold-light);}

  .grid-shelves{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .shelf-card{
    display:flex; align-items:center; gap:14px; background:#fff; border-radius:14px; padding:14px 16px;
    box-shadow:var(--shadow-soft); cursor:pointer;
  }
  .shelf-card .icon{font-size:24px; width:34px; text-align:center;}
  .shelf-card h3{margin:0 0 2px; font-size:15px; color:var(--ink);}
  .shelf-card p{margin:0; font-size:12px; color:#8a8474;}

  .back-shelf{background:none; border:none; color:var(--gold); font-weight:700; font-size:14px; margin-bottom:12px; cursor:pointer;}

  .book-card{
    display:flex; gap:12px; background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow-soft);
  }
  .book-cover{
    width:56px; height:76px; border-radius:8px; background:linear-gradient(135deg, var(--gold-light), var(--gold));
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink);
    background-size:cover; background-position:center;
  }
  .book-info{flex:1; min-width:0;}
  .book-info h3{margin:0 0 3px; font-size:14.5px; color:var(--ink);}
  .book-info .author{font-size:12px; color:#8a8474; margin-bottom:6px;}
  .book-info .desc{font-size:12px; color:#5c5648; line-height:1.4; margin-bottom:8px;}
  .book-links{display:flex; gap:8px; flex-wrap:wrap;}
  .book-links a{
    font-size:11.5px; font-weight:700; color:var(--ink); background:var(--cream); padding:5px 10px;
    border-radius:20px; text-decoration:none; border:1px solid var(--line);
  }
  .upload-tag{font-size:10px; color:var(--sage); font-weight:700; text-transform:uppercase; margin-left:6px;}

  .upload-btn{
    display:block; width:100%; background:var(--ink); color:#fff; border:none; padding:14px;
    border-radius:12px; font-weight:700; font-size:14px; margin-bottom:16px; cursor:pointer;
  }

  #uploadForm{display:none; background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  #uploadForm label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin:12px 0 6px;}
  #uploadForm label:first-of-type{margin-top:0;}
  #uploadForm input, #uploadForm select, #uploadForm textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px; font-size:14px;
    font-family:'Inter',sans-serif;
  }
  #uploadForm textarea{min-height:70px;}

  .empty{text-align:center; padding:50px 20px; color:#8a8474; font-size:14px;}
  .loading{text-align:center; padding:30px; color:#8a8474;}
  .back-link{display:block; text-align:center; margin-top:10px; font-size:14px; font-weight:600; color:var(--ink); text-decoration:none;}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>📚 Library</h1>
</header>

<div class="wrap">

  <div id="shelfListView">
    <div class="shelf-tabs">
      <button class="shelf-tab active" id="tabAcademicBtn" onclick="switchShelfType('academic')">🎓 Academic Grades</button>
      <button class="shelf-tab" id="tabSkillBtn" onclick="switchShelfType('skill')">✨ General Skills</button>
    </div>
    <div class="grid-shelves" id="shelfGrid"></div>
  </div>

  <div id="bookListView" style="display:none;">
    <button class="back-shelf" onclick="showShelfList()">&larr; All Shelves</button>
    <h3 id="shelfTitle" style="margin-bottom:14px;"></h3>

    <button class="upload-btn" onclick="toggleUploadForm()" id="uploadToggleBtn">+ Add a Book (Teachers)</button>

    <div id="uploadForm">
      <label>Title</label>
      <input type="text" id="bookTitle" placeholder="Book title">
      <label>Author</label>
      <input type="text" id="bookAuthor" placeholder="Author name">
      <label>Description</label>
      <textarea id="bookDesc" placeholder="What's this book about?"></textarea>
      <label>Upload PDF (your own original material)</label>
      <input type="file" id="bookPdfFile" accept="application/pdf">
      <div id="uploadStatus" style="font-size:12px; color:#8a8474; margin-top:6px;"></div>
      <button class="upload-btn" style="margin-top:14px;" onclick="submitBook()">Add to Library</button>
    </div>

    <div id="bookList"><div class="loading">Loading books…</div></div>
  </div>

  <a class="back-link" href="skillstream-dashboard.html">&larr; Back to Dashboard</a>
</div>

<script>
/* ====================================================================
   CONFIG — REQUIRED — same project as your other SkillStream pages
   ==================================================================== */
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentProfile = null;
let shelfType = 'academic';
let activeShelfValue = null;
let activeShelfLabel = '';

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const GRADE_SHELVES = [
  { value:'kg', label:'Kindergarten', icon:'🧸' },
  { value:'grade_1', label:'Grade 1', icon:'📗' },
  { value:'grade_2', label:'Grade 2', icon:'📗' },
  { value:'grade_3', label:'Grade 3', icon:'📗' },
  { value:'grade_4', label:'Grade 4', icon:'📘' },
  { value:'grade_5', label:'Grade 5', icon:'📘' },
  { value:'grade_6', label:'Grade 6', icon:'📘' },
  { value:'grade_7', label:'Grade 7', icon:'📙' },
  { value:'grade_8', label:'Grade 8', icon:'📙' },
  { value:'grade_9', label:'Grade 9', icon:'📕' },
  { value:'grade_10', label:'Grade 10', icon:'📕' },
  { value:'grade_11', label:'Grade 11', icon:'📕' },
  { value:'grade_12', label:'Grade 12', icon:'📕' },
  { value:'university', label:'University', icon:'🏛️' }
];

const SKILL_SHELVES = [
  { value:'Math', icon:'🔢' }, { value:'Science', icon:'🔬' },
  { value:'English & Language Arts', icon:'📖' }, { value:'History & Social Studies', icon:'🌍' },
  { value:'Foreign Languages', icon:'🗣️' }, { value:'Computer Science', icon:'💻' },
  { value:'Art & Design', icon:'🎨' }, { value:'Music', icon:'🎵' },
  { value:'Business', icon:'💼' }
];

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  currentUser = session.user;
  const { data: profile } = await sb.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
  currentProfile = profile;
  renderShelves();
}

function switchShelfType(type){
  shelfType = type;
  document.getElementById('tabAcademicBtn').classList.toggle('active', type === 'academic');
  document.getElementById('tabSkillBtn').classList.toggle('active', type === 'skill');
  renderShelves();
}

function renderShelves(){
  const grid = document.getElementById('shelfGrid');
  const shelves = shelfType === 'academic' ? GRADE_SHELVES : SKILL_SHELVES;
  grid.innerHTML = shelves.map(s => `
    <div class="shelf-card" onclick="openShelf('${s.value}', '${(s.label || s.value).replace(/'/g,"\\'")}')">
      <span class="icon">${s.icon}</span>
      <div><h3>${escapeHtml(s.label || s.value)}</h3><p>Tap to browse books</p></div>
    </div>
  `).join('');
}

function showShelfList(){
  document.getElementById('shelfListView').style.display = 'block';
  document.getElementById('bookListView').style.display = 'none';
}

async function openShelf(value, label){
  activeShelfValue = value;
  activeShelfLabel = label;
  document.getElementById('shelfListView').style.display = 'none';
  document.getElementById('bookListView').style.display = 'block';
  document.getElementById('shelfTitle').textContent = label;
  document.getElementById('uploadToggleBtn').style.display = (currentProfile?.role === 'teacher') ? 'block' : 'none';
  document.getElementById('uploadForm').style.display = 'none';
  await loadBooks();
}

function toggleUploadForm(){
  const form = document.getElementById('uploadForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function loadBooks(){
  const el = document.getElementById('bookList');
  el.innerHTML = '<div class="loading">Loading books…</div>';

  const column = shelfType === 'academic' ? 'grade_level' : 'subject';
  const { data, error } = await sb.from('library_books').select('*').eq(column, activeShelfValue).order('created_at', { ascending:false });

  if(error){ el.innerHTML = `<div class="empty">Couldn't load books.</div>`; return; }
  if(!data || data.length === 0){
    el.innerHTML = `<div class="empty">No books here yet.${currentProfile?.role === 'teacher' ? ' Tap "+ Add a Book" to be the first.' : ''}</div>`;
    return;
  }

  el.innerHTML = data.map(b => `
    <div class="book-card">
      <div class="book-cover" style="${b.cover_url ? `background-image:url('${b.cover_url}');` : ''}">${b.cover_url ? '' : '📕'}</div>
      <div class="book-info">
        <h3>${escapeHtml(b.title)}</h3>
        <div class="author">${escapeHtml(b.author || 'Unknown author')} ${b.pdf_url ? '<span class="upload-tag">Teacher Upload</span>' : ''}</div>
        <div class="desc">${escapeHtml(b.description || '')}</div>
        <div class="book-links">
          ${b.external_url ? `<a href="${b.external_url}" target="_blank" rel="noopener">Read Online →</a>` : ''}
          ${b.pdf_url ? `<a href="${b.pdf_url}" target="_blank" rel="noopener">Open PDF →</a>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

async function submitBook(){
  const title = document.getElementById('bookTitle').value.trim();
  const author = document.getElementById('bookAuthor').value.trim();
  const desc = document.getElementById('bookDesc').value.trim();
  const file = document.getElementById('bookPdfFile').files[0];

  if(!title){ alert('Please enter a title.'); return; }
  if(!file){ alert('Please upload a PDF file.'); return; }

  const status = document.getElementById('uploadStatus');
  status.textContent = 'Uploading…';

  try{
    const path = `library-pdfs/${currentUser.id}/${Date.now()}_${file.name}`;
    const { error: uploadError } = await sb.storage.from('skillstream-files').upload(path, file, { upsert:true });
    if(uploadError) throw uploadError;

    const { data: urlData } = sb.storage.from('skillstream-files').getPublicUrl(path);

    const payload = {
      title, author, description: desc,
      pdf_url: urlData.publicUrl,
      uploaded_by: currentUser.id,
      is_academic: shelfType === 'academic'
    };
    if(shelfType === 'academic') payload.grade_level = activeShelfValue;
    else payload.subject = activeShelfValue;

    const { error } = await sb.from('library_books').insert(payload);
    if(error) throw error;

    status.textContent = 'Added!';
    document.getElementById('bookTitle').value = '';
    document.getElementById('bookAuthor').value = '';
    document.getElementById('bookDesc').value = '';
    document.getElementById('bookPdfFile').value = '';
    toggleUploadForm();
    loadBooks();
  } catch(err){
    status.textContent = 'Error: ' + err.message;
  }
}

initAuth();
</script>
</body>
</html>
