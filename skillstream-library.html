<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/i18n.js?v=1"></script>
<link href="css/rtl.css?v=2" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.5/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --gold-light:#E4C583;
    --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2;
    --shadow-soft:0 2px 10px rgba(20,31,56,0.06);
    --shadow-card:0 8px 24px rgba(20,31,56,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); -webkit-font-smoothing:antialiased; padding-bottom:30px;}
  h1,h2,h3{font-family:'Syne',sans-serif;}

  header.top{background:linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%); color:var(--cream); padding:22px 20px 26px;}
  header.top .eyebrow{font-size:11.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; font-weight:600;}
  header.top h1{margin:0; font-size:24px;}

  .wrap{padding:18px;}

  .shelf-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .shelf-tab{
    flex:1; background:#fff; border:none; padding:12px; border-radius:12px;
    font-size:13.5px; font-weight:700; color:var(--ink); box-shadow:var(--shadow-soft);
  }
  .shelf-tab.active{background:var(--ink); color:var(--gold-light);}

  .grid-shelves{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .shelf-card{
    display:flex; align-items:center; gap:14px; background:#fff; border-radius:14px; padding:14px 16px;
    box-shadow:var(--shadow-soft); cursor:pointer;
  }
  .shelf-card .icon{font-size:24px; width:34px; text-align:center;}
  .shelf-card h3{margin:0 0 2px; font-size:15px; color:var(--ink);}
  .shelf-card p{margin:0; font-size:12px; color:#8a8474;}

  .back-shelf{background:none; border:none; color:var(--gold); font-weight:700; font-size:14px; margin-bottom:12px; cursor:pointer;}

  .book-card{
    display:flex; gap:12px; background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow-soft);
  }
  .book-cover{
    width:56px; height:76px; border-radius:8px; background:linear-gradient(135deg, var(--gold-light), var(--gold));
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink);
    background-size:cover; background-position:center;
  }
  .book-info{flex:1; min-width:0;}
  .book-info h3{margin:0 0 3px; font-size:14.5px; color:var(--ink);}
  .book-info .author{font-size:12px; color:#8a8474; margin-bottom:6px;}
  .book-info .desc{font-size:12px; color:#5c5648; line-height:1.4; margin-bottom:8px;}
  .book-links{display:flex; gap:8px; flex-wrap:wrap;}
  .book-links a{
    font-size:11.5px; font-weight:700; color:var(--ink); background:var(--cream); padding:5px 10px;
    border-radius:20px; text-decoration:none; border:1px solid var(--line);
  }
  .upload-tag{font-size:10px; color:var(--sage); font-weight:700; text-transform:uppercase; margin-left:6px;}

  .upload-btn{
    display:block; width:100%; background:var(--ink); color:#fff; border:none; padding:14px;
    border-radius:12px; font-weight:700; font-size:14px; margin-bottom:16px; cursor:pointer;
  }

  #uploadForm{display:none; background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  #uploadForm label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin:12px 0 6px;}
  #uploadForm label:first-of-type{margin-top:0;}
  #uploadForm input, #uploadForm select, #uploadForm textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px; font-size:14px;
    font-family:'Inter',sans-serif;
  }
  #uploadForm textarea{min-height:70px;}

  .tag-wait{font-size:10px; color:#B8691A; font-weight:700; text-transform:uppercase; margin-left:6px;}
  .adm-box{background:#fff; border:1.5px solid #E2BB5A; border-radius:14px; padding:12px; margin-bottom:16px;}
  .adm-box h3{margin:0 0 8px; font-size:14px;}
  .adm-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
  .adm-row b{flex:1 1 100%;}
  .mini{border:none; border-radius:20px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; background:var(--cream); color:var(--ink); border:1px solid var(--line);}
  .mini.ok{background:#2F7D4F; color:#fff; border-color:#2F7D4F;} .mini.no{background:#fff; color:#B03030; border-color:#B03030;}
  #pageViewer{position:fixed; inset:0; z-index:2147482000; background:#111; overflow:auto; display:none; -webkit-overflow-scrolling:touch;}
  #pageViewer .bar{position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#000; color:#fff; font-weight:700; z-index:2;}
  #pageViewer .bar button{background:#fff; color:#111; border:none; border-radius:20px; padding:8px 16px; font-weight:700; font-size:14px;}
  #pageViewer img{display:block; width:100%; max-width:900px; margin:0 auto 6px; background:#222; min-height:200px;}
  .empty{text-align:center; padding:50px 20px; color:#8a8474; font-size:14px;}
  .loading{text-align:center; padding:30px; color:#8a8474;}
  .back-link{display:block; text-align:center; margin-top:10px; font-size:14px; font-weight:600; color:var(--ink); text-decoration:none;}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1><span data-ic="book"></span>Library</h1>
</header>

<div class="wrap">

  <div id="shelfListView">
    <div class="shelf-tabs">
      <button class="shelf-tab active" id="tabAcademicBtn" onclick="switchShelfType('academic')"><span data-ic="learn"></span>Academic Grades</button>
      <button class="shelf-tab" id="tabSkillBtn" onclick="switchShelfType('skill')"><span data-ic="fa"></span>General Skills</button>
    </div>
    <div id="pendingBox"></div>
    <div class="grid-shelves" id="shelfGrid"></div>
  </div>

  <div id="bookListView" style="display:none;">
    <button class="back-shelf" onclick="showShelfList()">&larr; All Shelves</button>
    <h3 id="shelfTitle" style="margin-bottom:14px;"></h3>

    <button class="upload-btn" onclick="toggleUploadForm()" id="uploadToggleBtn">+ Add a Book</button>

    <div id="uploadForm">
      <label>Title</label>
      <input type="text" id="bookTitle" placeholder="Book title">
      <label>Author</label>
      <input type="text" id="bookAuthor" placeholder="Author name">
      <label>Description</label>
      <textarea id="bookDesc" placeholder="What's this book about?"></textarea>
      <label>A PDF, or photos of the pages</label>
      <input type="file" id="bookPdfFile" accept="application/pdf,image/*" multiple>
      <div style="font-size:12px; color:#8a8474; margin-top:6px;">One PDF (up to 20 MB), or up to 60 photos in page order. Photos are shrunk automatically to save data. Only add material you are allowed to share. An admin checks every book before others can see it.</div>
      <div id="uploadStatus" style="font-size:12px; color:#8a8474; margin-top:6px;"></div>
      <button class="upload-btn" style="margin-top:14px;" onclick="submitBook()">Add to Library</button>
    </div>

    <div id="bookList"><div class="loading">Loading books…</div></div>
  </div>

  <div id="pageViewer"><div class="bar"><span id="pvTitle"></span><button type="button" onclick="closeViewer()">Close</button></div><div id="pvPages"></div></div>

  <a class="back-link" href="skillstream-dashboard.html">&larr; Back to Dashboard</a>
</div>

<script>
/* ====================================================================
   CONFIG — REQUIRED — same project as your other SkillStream pages
   ==================================================================== */
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentProfile = null;
let shelfType = 'academic';
let activeShelfValue = null;
let activeShelfLabel = '';

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const GRADE_SHELVES = [
  { value:'kg', label:'Kindergarten', icon:'🧸' },
  { value:'grade_1', label:'Grade 1', icon:'📗' },
  { value:'grade_2', label:'Grade 2', icon:'📗' },
  { value:'grade_3', label:'Grade 3', icon:'📗' },
  { value:'grade_4', label:'Grade 4', icon:'📘' },
  { value:'grade_5', label:'Grade 5', icon:'📘' },
  { value:'grade_6', label:'Grade 6', icon:'📘' },
  { value:'grade_7', label:'Grade 7', icon:'📙' },
  { value:'grade_8', label:'Grade 8', icon:'📙' },
  { value:'grade_9', label:'Grade 9', icon:'📕' },
  { value:'grade_10', label:'Grade 10', icon:'📕' },
  { value:'grade_11', label:'Grade 11', icon:'📕' },
  { value:'grade_12', label:'Grade 12', icon:'📕' },
  { value:'university', label:'University', icon:'🏛️' }
];

const SKILL_SHELVES = [
  { value:'Math', icon:'🔢' }, { value:'Science', icon:'🔬' },
  { value:'English & Language Arts', icon:'📖' }, { value:'History & Social Studies', icon:'🌍' },
  { value:'Foreign Languages', icon:'🗣️' }, { value:'Computer Science', icon:'💻' },
  { value:'Art & Design', icon:'🎨' }, { value:'Music', icon:'🎵' },
  { value:'Business', icon:'💼' }
];

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  currentUser = session.user;
  const { data: profile } = await sb.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
  currentProfile = profile;
  renderShelves();
  loadPending();
}

function switchShelfType(type){
  shelfType = type;
  document.getElementById('tabAcademicBtn').classList.toggle('active', type === 'academic');
  document.getElementById('tabSkillBtn').classList.toggle('active', type === 'skill');
  renderShelves();
}

function renderShelves(){
  const grid = document.getElementById('shelfGrid');
  const shelves = shelfType === 'academic' ? GRADE_SHELVES : SKILL_SHELVES;
  grid.innerHTML = shelves.map(s => `
    <div class="shelf-card" onclick="openShelf('${s.value}', '${(s.label || s.value).replace(/'/g,"\\'")}')">
      <span class="icon">${s.icon}</span>
      <div><h3>${escapeHtml(s.label || s.value)}</h3><p>Tap to browse books</p></div>
    </div>
  `).join('');
}

function showShelfList(){
  document.getElementById('shelfListView').style.display = 'block';
  document.getElementById('bookListView').style.display = 'none';
}

async function openShelf(value, label){
  activeShelfValue = value;
  activeShelfLabel = label;
  document.getElementById('shelfListView').style.display = 'none';
  document.getElementById('bookListView').style.display = 'block';
  document.getElementById('shelfTitle').textContent = label;
  document.getElementById('uploadToggleBtn').style.display = 'block';
  document.getElementById('uploadForm').style.display = 'none';
  await loadBooks();
}

function toggleUploadForm(){
  const form = document.getElementById('uploadForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function loadBooks(){
  const el = document.getElementById('bookList');
  el.innerHTML = '<div class="loading">Loading books…</div>';

  const column = shelfType === 'academic' ? 'grade_level' : 'subject';
  const { data, error } = await sb.from('library_books').select('*').eq(column, activeShelfValue).order('created_at', { ascending:false });

  if(error){ el.innerHTML = `<div class="empty">Couldn't load books.</div>`; return; }
  if(!data || data.length === 0){
    el.innerHTML = `<div class="empty">No books here yet. Tap "+ Add a Book" to be the first.</div>`;
    return;
  }

  el.innerHTML = data.map(b => {
    const np = (b.pages && b.pages.length) || 0;
    const wait = b.status === 'pending' ? '<span class="tag-wait">Waiting for approval</span>' : (b.pdf_url || np ? '<span class="upload-tag">Shared book</span>' : '');
    return `
    <div class="book-card">
      <div class="book-cover" style="${b.cover_url ? `background-image:url('${escapeHtml(b.cover_url)}');` : ''}">${b.cover_url ? '' : '📕'}</div>
      <div class="book-info">
        <h3>${escapeHtml(b.title)}</h3>
        <div class="author">${escapeHtml(b.author || 'Unknown author')} ${wait}</div>
        <div class="desc">${escapeHtml(b.description || '')}</div>
        <div class="book-links">
          ${b.external_url ? `<a href="${escapeHtml(b.external_url)}" target="_blank" rel="noopener">Read Online →</a>` : ''}
          ${b.pdf_url ? `<a href="${escapeHtml(b.pdf_url)}" target="_blank" rel="noopener">Open PDF →</a>` : ''}
          ${np ? `<a href="#" data-read="${escapeHtml(b.id)}">Read ${np} pages →</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
  window.__books = window.__books || {}; data.forEach(b => { window.__books[b.id] = b; });
}

const PHOTO_MAX = 60, PDF_MAX = 20 * 1024 * 1024;
function shrink(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(bl => bl ? resolve(bl) : reject(new Error('Could not read a photo')), 'image/jpeg', 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('A photo could not be opened. Use JPG or PNG.')); };
    img.src = url;
  });
}
async function submitBook(){
  const title = document.getElementById('bookTitle').value.trim();
  const author = document.getElementById('bookAuthor').value.trim();
  const desc = document.getElementById('bookDesc').value.trim();
  const files = Array.from(document.getElementById('bookPdfFile').files || []);
  const status = document.getElementById('uploadStatus');
  const btn = document.querySelector('#uploadForm button.upload-btn');

  if(!title){ alert('Please enter a title.'); return; }
  if(title.length > 120 || author.length > 120 || desc.length > 600){ alert('Title and author: up to 120 letters. Description: up to 600.'); return; }
  if(!files.length){ alert('Please choose a PDF or photos.'); return; }
  const pdfs = files.filter(f => f.type === 'application/pdf'), imgs = files.filter(f => /^image\//.test(f.type));
  if(pdfs.length + imgs.length !== files.length || (pdfs.length && imgs.length) || pdfs.length > 1){ alert('Choose one PDF, or photos only (not both).'); return; }
  if(pdfs.length && pdfs[0].size > PDF_MAX){ alert('The PDF is larger than 20 MB. Please choose a smaller file.'); return; }
  if(imgs.length > PHOTO_MAX){ alert('Up to ' + PHOTO_MAX + ' photos per book.'); return; }

  btn.disabled = true; status.textContent = 'Uploading…';
  const uploaded = [];
  try{
    const base = `library-pdfs/${currentUser.id}/${Date.now()}`;
    const payload = { title, author, description: desc, uploaded_by: currentUser.id, status: 'pending', is_academic: shelfType === 'academic' };
    if(pdfs.length){
      const path = `${base}_${String(pdfs[0].name).replace(/[^A-Za-z0-9._-]/g,'_').slice(-60)}`;
      const up = await sb.storage.from('skillstream-files').upload(path, pdfs[0], { upsert:false });
      if(up.error) throw up.error;
      uploaded.push(path);
      payload.pdf_url = sb.storage.from('skillstream-files').getPublicUrl(path).data.publicUrl;
    } else {
      payload.pages = [];
      for(let i = 0; i < imgs.length; i++){
        status.textContent = 'Photo ' + (i + 1) + ' of ' + imgs.length + '…';
        const blob = await shrink(imgs[i]);
        const path = `${base}_p${String(i + 1).padStart(2, '0')}.jpg`;
        const up = await sb.storage.from('skillstream-files').upload(path, blob, { contentType:'image/jpeg', upsert:false });
        if(up.error) throw up.error;
        uploaded.push(path); payload.pages.push(path);
      }
    }
    if(shelfType === 'academic') payload.grade_level = activeShelfValue; else payload.subject = activeShelfValue;
    const { error } = await sb.from('library_books').insert(payload);
    if(error) throw error;

    status.textContent = 'Sent! An admin will check it, then it appears for everyone.';
    ['bookTitle','bookAuthor','bookDesc','bookPdfFile'].forEach(id => { document.getElementById(id).value = ''; });
    toggleUploadForm();
    loadBooks();
  } catch(err){
    if(uploaded.length){ try{ await sb.storage.from('skillstream-files').remove(uploaded); }catch(e){} }
    status.textContent = 'Error: ' + (err.message || 'upload failed');
  }
  btn.disabled = false;
}

/* ---- reading a photo book ---- */
function pageUrl(path){ return sb.storage.from('skillstream-files').getPublicUrl(path).data.publicUrl; }
function openViewer(b){
  document.getElementById('pvTitle').textContent = b.title;
  const box = document.getElementById('pvPages'); box.textContent = '';
  (b.pages || []).forEach((p, i) => { const im = document.createElement('img'); im.loading = 'lazy'; im.alt = 'Page ' + (i + 1); im.src = pageUrl(p); box.appendChild(im); });
  document.getElementById('pageViewer').style.display = 'block'; document.body.style.overflow = 'hidden';
}
function closeViewer(){ document.getElementById('pageViewer').style.display = 'none'; document.body.style.overflow = ''; }
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('[data-read]'); if(!a) return;
  ev.preventDefault();
  const b = (window.__books || {})[a.dataset.read]; if(b) openViewer(b);
});

/* ---- admin: approve or reject ---- */
async function loadPending(){
  const box = document.getElementById('pendingBox');
  if(currentProfile?.role !== 'admin'){ box.innerHTML = ''; return; }
  const { data } = await sb.from('library_books').select('*').eq('status', 'pending').order('created_at', { ascending:true });
  window.__books = window.__books || {};
  if(!data || !data.length){ box.innerHTML = ''; return; }
  data.forEach(b => { window.__books[b.id] = b; });
  box.innerHTML = '<div class="adm-box"><h3>Waiting for approval (' + data.length + ')</h3>' + data.map(b => {
    const np = (b.pages && b.pages.length) || 0;
    return '<div class="adm-row"><b>' + escapeHtml(b.title) + '</b><span>' + escapeHtml(b.author || '') + ' · ' + escapeHtml(b.grade_level || b.subject || '') + '</span>'
      + (b.pdf_url ? '<a class="mini" href="' + escapeHtml(b.pdf_url) + '" target="_blank" rel="noopener">Open PDF</a>' : '')
      + (np ? '<a class="mini" href="#" data-read="' + escapeHtml(b.id) + '">View ' + np + ' pages</a>' : '')
      + '<button class="mini ok" data-ok="' + escapeHtml(b.id) + '">Approve</button><button class="mini no" data-no="' + escapeHtml(b.id) + '">Reject</button></div>';
  }).join('') + '</div>';
}
document.addEventListener('click', async ev => {
  const ok = ev.target.closest && ev.target.closest('[data-ok]'), no = ev.target.closest && ev.target.closest('[data-no]');
  if(!ok && !no) return;
  const id = (ok || no).dataset.ok || (ok || no).dataset.no, b = (window.__books || {})[id];
  if(no && !confirm('Reject and delete this book?')) return;
  (ok || no).disabled = true;
  if(ok){
    const { error } = await sb.from('library_books').update({ status:'approved' }).eq('id', id);
    if(error){ alert(error.message); (ok || no).disabled = false; return; }
  } else {
    const { error } = await sb.from('library_books').delete().eq('id', id);
    if(error){ alert(error.message); (ok || no).disabled = false; return; }
    try{ const files = (b && b.pages || []).slice(); if(b && b.pdf_url){ const i = b.pdf_url.indexOf('/skillstream-files/'); if(i >= 0) files.push(decodeURIComponent(b.pdf_url.slice(i + 19))); } if(files.length) await sb.storage.from('skillstream-files').remove(files); }catch(e){}
  }
  loadPending();
});

initAuth();
</script>
<script src="js/nav.js" defer></script>
</body>
</html>
