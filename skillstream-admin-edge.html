<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin: The Edge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.5/dist/umd/supabase.js"></script>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FBF7EF;color:#2B2B2B;padding:18px;max-width:640px;margin:0 auto}
  h1{font-size:22px;color:#141F38;margin:0 0 6px}
  p{font-size:14px;line-height:1.5;color:#6B6558}
  .btn{padding:12px 16px;border-radius:12px;border:0;background:#141F38;color:#fff;font:700 15px Inter,sans-serif;cursor:pointer}
  .btn.s{padding:8px 12px;font-size:13px;background:#fff;color:#141F38;border:1.5px solid #141F38}
  .card{background:#fff;border:1.5px solid #E9E2D2;border-radius:14px;padding:12px;margin:10px 0}
  .card.h{opacity:.55}
  .t{font-weight:800;color:#141F38;font-size:15px}
  .m{font-size:12.5px;color:#6B6558;margin:4px 0 8px;line-height:1.5}
  #msg{margin:12px 0;font-size:14px;white-space:pre-wrap}
  a{color:#8A6A1F}
</style>
</head>
<body>
<a href="skillstream-admin.html">← Admin</a>
<h1>The Edge: automatic cards</h1>
<p>New cards are added once a day from public news feeds and written by AI. You can hide any card. Hidden cards disappear for students.</p>
<button class="btn" id="run" type="button">Run the update now</button>
<div id="msg"></div>
<div id="locked" style="display:none"><p>This page is for admins only.</p></div>
<div id="list"></div>
<script>
const sb = window.supabase.createClient('https://vauudtedojtcveiqajlr.supabase.co','sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE');
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tok='';
async function load(){
  const {data,error}=await sb.from('edge_items').select('id,industry,title,what_text,source_name,source_url,as_of,hidden,created_at').order('created_at',{ascending:false}).limit(60);
  if(error){$('list').textContent='Could not load. Has migration 041 been run?';return}
  $('list').innerHTML=(data||[]).map(x=>'<div class="card'+(x.hidden?' h':'')+'"><div class="t">'+esc(x.title)+'</div><div class="m">'+esc(x.industry)+' · '+esc(x.as_of||'')+' · <a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">'+esc(x.source_name)+'</a></div><div class="m">'+esc(x.what_text)+'</div><button class="btn s" data-id="'+x.id+'" data-h="'+(x.hidden?'0':'1')+'">'+(x.hidden?'Show again':'Hide')+'</button></div>').join('')||'<p>No automatic cards yet. Press "Run the update now".</p>';
  document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from('edge_items').update({hidden:b.dataset.h==='1'}).eq('id',b.dataset.id);load()});
}
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='skillstream-login.html';return}
  tok=session.access_token;
  const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
  if(!p||p.role!=='admin'){$('locked').style.display='block';$('run').style.display='none';return}
  load();
})();
$('run').onclick=async()=>{
  $('run').disabled=true;$('msg').textContent='Running…';
  try{
    const r=await fetch('/api/edge-refresh',{method:'POST',headers:{Authorization:'Bearer '+tok}});
    const j=await r.json();
    const rep=(j.report||[]).map(x=>(x.ok?'OK  ':'FAIL')+' '+x.industry+' '+x.source+(x.ok?' ('+x.items+')':' '+x.err)).join('\n');
    $('msg').textContent=(r.ok?('Added '+j.added+' new cards. '+(j.note||'')):('Problem: '+(j.error||r.status)))+'\n\nFeeds:\n'+rep;
    load();
  }catch(e){$('msg').textContent='Could not run.'}
  $('run').disabled=false;
};
</script>
</body>
</html>
