<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Showcase — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --gold-light:#E4C583;
    --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2;
    --shadow-soft:0 2px 10px rgba(20,31,56,0.06);
    --shadow-card:0 8px 24px rgba(20,31,56,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); -webkit-font-smoothing:antialiased; padding-bottom:30px;}
  h1,h2,h3{font-family:'Syne',sans-serif;}

  header.top{background:linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%); color:var(--cream); padding:22px 20px 26px;}
  header.top .eyebrow{font-size:11.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; font-weight:600;}
  header.top h1{margin:0; font-size:24px;}

  .wrap{padding:18px;}

  .share-btn{
    display:block; width:100%; background:var(--ink); color:#fff; border:none; padding:15px;
    border-radius:14px; font-weight:700; font-size:15px; margin-bottom:18px; cursor:pointer;
  }

  #shareForm{display:none; background:#fff; border-radius:16px; padding:18px; margin-bottom:18px; box-shadow:var(--shadow-card);}
  #shareForm label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin:12px 0 6px;}
  #shareForm label:first-of-type{margin-top:0;}
  #shareForm input, #shareForm textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-family:'Inter',sans-serif;
  }
  #shareForm textarea{min-height:80px;}
  .subject-icon-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:4px;}
  .subj-btn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:var(--cream); border:1.5px solid var(--line); border-radius:11px; padding:9px 4px; cursor:pointer;
  }
  .subj-btn .icon{font-size:18px;}
  .subj-btn .lbl{font-size:9px; font-weight:600; text-align:center; line-height:1.15;}
  .subj-btn.active{background:var(--gold); border-color:var(--gold);}

  .project-card{
    background:#fff; border-radius:16px; overflow:hidden; margin-bottom:14px; box-shadow:var(--shadow-card);
  }
  .project-card.pinned{border:2px solid var(--gold-light);}
  .pin-tag{
    display:inline-flex; align-items:center; gap:5px; background:var(--gold); color:var(--ink);
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; margin:12px 12px 0;
  }
  .project-image{width:100%; height:160px; object-fit:cover; background:linear-gradient(135deg, var(--gold-light), var(--gold));}
  .project-body{padding:16px;}
  .project-body h3{margin:0 0 4px; font-size:16px; color:var(--ink);}
  .project-meta{font-size:12px; color:#8a8474; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .project-avatar{
    width:22px; height:22px; border-radius:50%; background:var(--gold-light); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;
  }
  .project-desc{font-size:13.5px; color:#5c5648; line-height:1.5; margin-bottom:10px;}
  .project-actions{display:flex; align-items:center; gap:14px; padding-top:10px; border-top:1px solid var(--line);}
  .like-btn{background:none; border:none; font-size:14px; font-weight:700; color:var(--charcoal); cursor:pointer; display:flex; align-items:center; gap:5px;}
  .like-btn.liked{color:#c0523a;}
  .comment-toggle{background:none; border:none; font-size:14px; color:var(--charcoal); cursor:pointer;}
  .pin-btn{margin-left:auto; background:none; border:none; font-size:12px; font-weight:700; color:var(--gold);}
  .project-link{font-size:12.5px; font-weight:700; color:var(--ink);}

  .comments-section{display:none; padding:0 16px 16px;}
  .comment-row{background:var(--cream); border-radius:10px; padding:9px 12px; margin-bottom:6px; font-size:13px;}
  .comment-row .c-name{font-weight:700; color:var(--ink);}
  .comment-input-row{display:flex; gap:8px; margin-top:8px;}
  .comment-input-row input{flex:1; padding:9px 12px; border:1.5px solid var(--line); border-radius:20px; font-size:13px;}
  .comment-input-row button{background:var(--ink); color:#fff; border:none; padding:0 14px; border-radius:20px; font-weight:700; font-size:13px;}

  .empty{text-align:center; padding:50px 20px; color:#8a8474; font-size:14px;}
  .loading{text-align:center; padding:30px; color:#8a8474;}
  .back-link{display:block; text-align:center; margin-top:10px; font-size:14px; font-weight:600; color:var(--ink); text-decoration:none;}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>🖼️ Project Showcase</h1>
</header>

<div class="wrap">
  <button class="share-btn" onclick="toggleShareForm()">+ Share Your Project</button>

  <div id="shareForm">
    <label>Title</label>
    <input type="text" id="pTitle" placeholder="What did you make?">
    <label>Description</label>
    <textarea id="pDesc" placeholder="Tell everyone about it..."></textarea>
    <label>Subject</label>
    <div class="subject-icon-grid" id="pSubjectGrid"></div>
    <label>Image (optional)</label>
    <input type="file" id="pImageFile" accept="image/*">
    <label>Link (optional — live site, video, GitHub, etc.)</label>
    <input type="text" id="pLink" placeholder="https://...">
    <div id="pStatus" style="font-size:12px; color:#8a8474; margin-top:8px;"></div>
    <button class="share-btn" style="margin-top:14px;" onclick="submitProject()">Post to Showcase</button>
  </div>

  <div id="projectList"><div class="loading">Loading projects…</div></div>

  <a class="back-link" href="skillstream-dashboard.html">&larr; Back to Dashboard</a>
</div>

<script>
/* ====================================================================
   CONFIG — REQUIRED — same project as your other SkillStream pages
   ==================================================================== */
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentProfile = null;
let projectSubject = '';
let profilesCache = {};
let likedProjectIds = new Set();

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const SUBJECTS = [
  { value:'Math', icon:'🔢' }, { value:'Science', icon:'🔬' },
  { value:'English & Language Arts', icon:'📖' }, { value:'History & Social Studies', icon:'🌍' },
  { value:'Foreign Languages', icon:'🗣️' }, { value:'Computer Science', icon:'💻' },
  { value:'Art & Design', icon:'🎨' }, { value:'Music', icon:'🎵' },
  { value:'Business', icon:'💼' }, { value:'Other', icon:'➕' }
];

function renderSubjectGrid(){
  document.getElementById('pSubjectGrid').innerHTML = SUBJECTS.map(s => `
    <div class="subj-btn ${s.value === projectSubject ? 'active' : ''}" onclick="selectProjectSubject('${s.value}')">
      <div class="icon">${s.icon}</div>
      <div class="lbl">${s.value}</div>
    </div>
  `).join('');
}
function selectProjectSubject(v){ projectSubject = v; renderSubjectGrid(); }
renderSubjectGrid();

function toggleShareForm(){
  const form = document.getElementById('shareForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  currentUser = session.user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  currentProfile = profile;
  loadProjects();
}

async function getProfile(userId){
  if(profilesCache[userId]) return profilesCache[userId];
  const { data } = await sb.from('profiles').select('full_name, role').eq('id', userId).maybeSingle();
  profilesCache[userId] = data || { full_name:'Unknown' };
  return profilesCache[userId];
}

async function loadProjects(){
  const el = document.getElementById('projectList');
  el.innerHTML = '<div class="loading">Loading projects…</div>';

  const { data: projects, error } = await sb.from('projects').select('*').order('is_teachers_pick', { ascending:false }).order('created_at', { ascending:false });
  if(error){ el.innerHTML = `<div class="empty">Couldn't load projects.</div>`; return; }
  if(!projects || projects.length === 0){
    el.innerHTML = `<div class="empty">No projects shared yet — be the first!</div>`;
    return;
  }

  const { data: myLikes } = await sb.from('project_likes').select('project_id').eq('user_id', currentUser.id);
  likedProjectIds = new Set((myLikes || []).map(l => l.project_id));

  const { data: likeCounts } = await sb.from('project_likes').select('project_id');
  const countMap = {};
  (likeCounts || []).forEach(l => { countMap[l.project_id] = (countMap[l.project_id] || 0) + 1; });

  const cards = await Promise.all(projects.map(async p => {
    const author = await getProfile(p.user_id);
    const initials = (author.full_name || '?').charAt(0).toUpperCase();
    const isLiked = likedProjectIds.has(p.id);
    const likeCount = countMap[p.id] || 0;
    const isTeacher = currentProfile?.role === 'teacher';

    return `
    <div class="project-card ${p.is_teachers_pick ? 'pinned' : ''}">
      ${p.is_teachers_pick ? '<div class="pin-tag">⭐ Teacher\\'s Pick</div>' : ''}
      ${p.image_url ? `<img class="project-image" src="${p.image_url}">` : ''}
      <div class="project-body">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="project-meta">
          <span class="project-avatar">${initials}</span> ${escapeHtml(author.full_name || 'Unknown')}
          ${p.subject ? ' · ' + escapeHtml(p.subject) : ''}
        </div>
        <div class="project-desc">${escapeHtml(p.description || '')}</div>
        ${p.link_url ? `<a class="project-link" href="${p.link_url}" target="_blank" rel="noopener">🔗 View Project →</a>` : ''}
        <div class="project-actions">
          <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
            ${isLiked ? '❤️' : '🤍'} <span id="likeCount-${p.id}">${likeCount}</span>
          </button>
          <button class="comment-toggle" onclick="toggleComments('${p.id}')">💬 Comments</button>
          ${isTeacher ? `<button class="pin-btn" onclick="togglePin('${p.id}', ${!p.is_teachers_pick})">${p.is_teachers_pick ? 'Unpin' : 'Pin as Pick'}</button>` : ''}
        </div>
      </div>
      <div class="comments-section" id="comments-${p.id}">
        <div id="commentList-${p.id}"><div class="loading">Loading…</div></div>
        <div class="comment-input-row">
          <input type="text" id="commentInput-${p.id}" placeholder="Add a comment...">
          <button onclick="postComment('${p.id}')">Post</button>
        </div>
      </div>
    </div>`;
  }));

  el.innerHTML = cards.join('');
}

async function toggleLike(projectId){
  const isLiked = likedProjectIds.has(projectId);
  if(isLiked){
    await sb.from('project_likes').delete().eq('project_id', projectId).eq('user_id', currentUser.id);
    likedProjectIds.delete(projectId);
  } else {
    await sb.from('project_likes').insert({ project_id: projectId, user_id: currentUser.id });
    likedProjectIds.add(projectId);
  }
  loadProjects();
}

async function togglePin(projectId, newValue){
  const { error } = await sb.rpc('set_teachers_pick', { p_project_id: projectId, p_value: newValue });
  if(error){ alert('Error: ' + error.message); return; }
  loadProjects();
}

function toggleComments(projectId){
  const section = document.getElementById('comments-' + projectId);
  const isOpen = section.style.display === 'block';
  section.style.display = isOpen ? 'none' : 'block';
  if(!isOpen) loadComments(projectId);
}

async function loadComments(projectId){
  const el = document.getElementById('commentList-' + projectId);
  const { data, error } = await sb.from('project_comments').select('*').eq('project_id', projectId).order('created_at', { ascending:true });
  if(error){ el.innerHTML = 'Could not load comments.'; return; }
  if(!data || data.length === 0){ el.innerHTML = '<div style="font-size:12.5px; color:#8a8474;">No comments yet.</div>'; return; }

  const rows = await Promise.all(data.map(async c => {
    const author = await getProfile(c.user_id);
    return `<div class="comment-row"><span class="c-name">${escapeHtml(author.full_name || 'Learner')}:</span> ${escapeHtml(c.body)}</div>`;
  }));
  el.innerHTML = rows.join('');
}

async function postComment(projectId){
  const input = document.getElementById('commentInput-' + projectId);
  const body = input.value.trim();
  if(!body) return;
  const { error } = await sb.from('project_comments').insert({ project_id: projectId, user_id: currentUser.id, body });
  if(error){ alert('Error: ' + error.message); return; }
  input.value = '';
  loadComments(projectId);
}

async function submitProject(){
  const title = document.getElementById('pTitle').value.trim();
  const desc = document.getElementById('pDesc').value.trim();
  const link = document.getElementById('pLink').value.trim();
  const file = document.getElementById('pImageFile').files[0];

  if(!title){ alert('Please enter a title.'); return; }

  const status = document.getElementById('pStatus');
  status.textContent = 'Posting…';

  try{
    let imageUrl = null;
    if(file){
      const path = `project-images/${currentUser.id}/${Date.now()}_${file.name}`;
      const { error: uploadError } = await sb.storage.from('skillstream-files').upload(path, file, { upsert:true });
      if(uploadError) throw uploadError;
      const { data: urlData } = sb.storage.from('skillstream-files').getPublicUrl(path);
      imageUrl = urlData.publicUrl;
    }

    const { error } = await sb.from('projects').insert({
      user_id: currentUser.id, title, description: desc,
      subject: projectSubject || null, image_url: imageUrl, link_url: link || null
    });
    if(error) throw error;

    status.textContent = 'Posted!';
    document.getElementById('pTitle').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pLink').value = '';
    document.getElementById('pImageFile').value = '';
    projectSubject = ''; renderSubjectGrid();
    toggleShareForm();
    loadProjects();
  } catch(err){
    status.textContent = 'Error: ' + err.message;
  }
}

initAuth();
</script>
</body>
</html>
