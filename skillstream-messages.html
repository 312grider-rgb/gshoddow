<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/i18n.js?v=1"></script>
<link href="css/rtl.css?v=2" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.5/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --gold-light:#E4C583;
    --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2;
    --shadow-soft:0 2px 10px rgba(20,31,56,0.06);
    --shadow-card:0 8px 24px rgba(20,31,56,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Syne',sans-serif;}

  header.top{background:linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%); color:var(--cream); padding:22px 20px 26px;}
  header.top .eyebrow{font-size:11.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; font-weight:600;}
  header.top h1{margin:0; font-size:24px; font-weight:600;}

  .wrap{padding:18px;}

  /* Inbox list */
  #inboxView .convo-card{
    display:flex; align-items:center; gap:12px; background:#fff; padding:12px 14px; min-height:64px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  #inboxView .convo-card:first-of-type{border-top-left-radius:14px; border-top-right-radius:14px;}
  .convo-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
  .unread-count{min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--gold); color:#fff; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .convo-card.has-unread .convo-name,.convo-card.has-unread .convo-preview{font-weight:700; color:var(--ink);}
  .tick{font-size:12px; color:#a8a094; letter-spacing:-3px; margin-right:6px;} .tick.read{color:#2f80ed;}
  .convo-avatar{
    width:42px; height:42px; border-radius:50%; background:var(--gold-light); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 42px; font-family:'Syne',sans-serif;
  }
  .convo-info{flex:1; min-width:0;}
  .convo-name{font-size:14.5px; font-weight:700; color:var(--ink);}
  .convo-preview{font-size:12.5px; color:#8a8474; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .convo-time{font-size:11px; color:#a8a094; flex-shrink:0;}
  .unread-dot{width:9px; height:9px; border-radius:50%; background:var(--gold); flex:0 0 9px;}

  .new-msg-btn{
    display:block; width:100%; background:var(--ink); color:#fff; border:none; padding:14px;
    border-radius:12px; font-size:14.5px; font-weight:700; margin-bottom:16px; cursor:pointer;
  }

  /* New message picker */
  #newMsgView, #threadView{ display:none; }
  .back-btn{background:none; border:none; color:var(--gold); font-weight:700; font-size:14px; margin-bottom:14px; cursor:pointer;}
  .person-card{
    display:flex; align-items:center; gap:12px; background:#fff; border-radius:12px; padding:12px 14px;
    margin-bottom:8px; box-shadow:var(--shadow-soft); cursor:pointer;
  }
  .person-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--gold-light); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 36px; font-size:13px;
  }
  .person-name{font-size:14px; font-weight:600; color:var(--ink);}
  .person-role{font-size:11.5px; color:#8a8474; text-transform:capitalize;}

  /* Thread view */
  #threadView{ display:none; }
  #threadHeader{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  #threadMessages{
    display:flex; flex-direction:column; gap:8px; margin-bottom:16px; min-height:200px;
  }
  .bubble{ max-width:78%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; }
  .bubble.me{ background:var(--ink); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .bubble.them{ background:#fff; color:var(--charcoal); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:var(--shadow-soft); }
  .vn{background:rgba(255,255,255,.18); border:1px solid currentColor; color:inherit; border-radius:18px; padding:8px 14px; font-weight:600; font-size:14px; cursor:pointer;}
  #micBtn.rec{background:#c0392b; color:#fff;}
  .upd{background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:8px; border-left:4px solid var(--gold);} .upd b{font-size:13px; color:#8A6A1F;} .upd div{font-size:14px; margin-top:4px; overflow-wrap:anywhere;}
  .bubble.me .tick{color:#9fb6d9; margin-right:0;} .bubble.me .tick.read{color:#6ec1ff;}
  .bubble .bubble-time{ font-size:10px; opacity:0.6; margin-top:4px; display:block; }

  .compose-row{ display:flex; gap:8px; position:sticky; bottom:68px; background:var(--cream); padding-top:8px; }
  .compose-row input{
    flex:1; padding:12px 14px; border:1.5px solid var(--line); border-radius:22px; font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .compose-row button{
    background:var(--ink); color:#fff; border:none; padding:0 20px; border-radius:22px; font-weight:700; font-size:14px;
  }

  .sec-title{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#8A6A1F; font-weight:700; margin:18px 0 8px;}
  a.convo-card{text-decoration:none; color:inherit;}
  .convo-avatar.alt{background:#E8F1EA; font-size:18px;}
  .empty{ text-align:center; padding:60px 20px; color:#8a8474; font-size:14px; }
  .loading{ text-align:center; padding:30px; color:#8a8474; }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>Messages</h1>
</header>

<div class="wrap">

  <div id="inboxView">
    <button class="new-msg-btn" onclick="showNewMessage()">+ New Message</button>
    <div id="classUpdates"></div>
    <div id="otherChats"></div>
    <div class="sec-title" id="privTitle" style="display:none">Private messages</div>
    <div id="convoList"><div class="loading">Loading…</div></div>
  </div>

  <div id="newMsgView">
    <button class="back-btn" onclick="showInbox()">&larr; Back</button>
    <h3 style="margin-bottom:12px;">Start a conversation</h3>
    <div id="peopleList"><div class="loading">Loading people…</div></div>
  </div>

  <div id="threadView">
    <div id="threadHeader">
      <button class="back-btn" onclick="showInbox()" style="margin:0;">&larr;</button>
      <h3 id="threadName" style="margin:0;"></h3>
    </div>
    <div id="threadMessages"></div>
    <div class="compose-row">
      <input type="text" id="composeInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="micBtn" type="button" aria-label="Voice note" style="padding:0 14px;" onclick="toggleRec()">🎤</button>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script>
/* ====================================================================
   CONFIG — REQUIRED — same project as your other SkillStream pages
   ==================================================================== */
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let activeThreadUserId = null;
let profilesCache = {};

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  currentUser = session.user;
  loadInbox();

  sb.auth.onAuthStateChange((event, session)=>{
    if(!session){ window.location.href = 'skillstream-login.html'; }
  });
}

function showInbox(){
  document.getElementById('inboxView').style.display = 'block';
  document.getElementById('newMsgView').style.display = 'none';
  document.getElementById('threadView').style.display = 'none';
  loadInbox();
}

function showNewMessage(){
  document.getElementById('inboxView').style.display = 'none';
  document.getElementById('newMsgView').style.display = 'block';
  document.getElementById('threadView').style.display = 'none';
  loadPeople();
}

async function getProfile(userId){
  if(profilesCache[userId]) return profilesCache[userId];
  const { data } = await sb.from('public_profiles').select('full_name, name, username, role, avatar_url').eq('id', userId).maybeSingle();
  profilesCache[userId] = data ? Object.assign({}, data, { full_name: data.full_name || data.name || data.username || 'Member' }) : { full_name: 'Member' };
  return profilesCache[userId];
}

/* ---------- INBOX: group messages by conversation partner ---------- */
/* ---------- CLASS CHATS and STUDY GROUPS live here too ---------- */
async function loadOtherChats(){
  const box = document.getElementById('otherChats');
  const classes = new Map(), groups = [];
  try {
    const teach = await sb.from('classrooms').select('id, name').eq('teacher_id', currentUser.id);
    (teach.data || []).forEach(c => classes.set(c.id, c.name));
    const mem = await sb.from('classroom_members').select('classroom_id').eq('student_id', currentUser.id);
    const ids = (mem.data || []).map(m => m.classroom_id).filter(id => !classes.has(id));
    if(ids.length){
      const enr = await sb.from('classrooms').select('id, name').in('id', ids);
      (enr.data || []).forEach(c => classes.set(c.id, c.name));
    }
  } catch(e) {}
  try {
    const g = await sb.rpc('list_study_groups');
    (g.data || []).filter(x => x.is_member).forEach(x => groups.push(x));
  } catch(e) {}
  let html = '';
  if(classes.size){
    html += '<div class="sec-title">Class chats</div>';
    classes.forEach((name, id) => {
      html += `<a class="convo-card" href="skillstream-classrooms.html?open=${encodeURIComponent(id)}&tab=chat">
        <div class="convo-avatar alt">🎓</div>
        <div class="convo-info"><div class="convo-name" data-no-i18n>${escapeHtml(name || '')}</div><div class="convo-preview">Class chat</div></div></a>`;
    });
  }
  if(groups.length){
    html += '<div class="sec-title">Study groups</div>';
    groups.forEach(x => {
      html += `<a class="convo-card" href="skillstream-community.html?open=${encodeURIComponent(x.id)}">
        <div class="convo-avatar alt">👥</div>
        <div class="convo-info"><div class="convo-name" data-no-i18n>${escapeHtml(x.name || '')}</div><div class="convo-preview">Study group</div></div></a>`;
    });
  }
  box.innerHTML = html;
  document.getElementById('privTitle').style.display = html ? 'block' : 'none';
}

function shortTime(iso){
  const d = new Date(iso), n = new Date();
  if(d.toDateString() === n.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function tickHtml(m){ return `<span class="tick${m.is_read ? ' read' : ''}" aria-label="${m.is_read ? 'Read' : 'Sent'}">${m.is_read ? '✓✓' : '✓'}</span>`; }

async function loadInbox(){
  loadOtherChats();
  loadUpdates();
  const el = document.getElementById('convoList');
  el.innerHTML = '<div class="loading">Loading…</div>';

  const { data, error } = await sb
    .from('direct_messages')
    .select('*')
    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
    .order('created_at', { ascending:false });

  if(error){
    el.innerHTML = `<div class="empty">Couldn't load messages.</div>`;
    return;
  }

  if(!data || data.length === 0){
    el.innerHTML = `<div class="empty">No messages yet — tap "+ New Message" to start a conversation.</div>`;
    return;
  }

  // Group by the OTHER person in each message
  const convos = {};
  for(const m of data){
    const otherId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
    if(!convos[otherId]) convos[otherId] = { lastMessage: m, unread: 0 };
    if(m.receiver_id === currentUser.id && !m.is_read) convos[otherId].unread++;
  }

  const entries = await Promise.all(Object.entries(convos).map(async ([otherId, info]) => {
    const profile = await getProfile(otherId);
    return { otherId, profile, ...info };
  }));

  el.innerHTML = entries.map(c => {
    const initials = (c.profile.full_name || '?').trim().charAt(0).toUpperCase();
    return `
    <div class="convo-card${c.unread>0?' has-unread':''}" onclick="openThread('${c.otherId}', '${escapeHtml(c.profile.full_name || 'Member').replace(/'/g,"\\'")}')">
      <div class="convo-avatar">${c.profile.avatar_url ? `<img src="${escapeHtml(c.profile.avatar_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initials}</div>
      <div class="convo-info">
        <div class="convo-name">${escapeHtml(c.profile.full_name || 'Member')}</div>
        <div class="convo-preview">${c.lastMessage.sender_id === currentUser.id ? tickHtml(c.lastMessage) : ''}${escapeHtml(c.lastMessage.body)}</div>
      </div>
      <div class="convo-side">
        <div class="convo-time">${shortTime(c.lastMessage.created_at)}</div>
        ${c.unread > 0 ? `<span class="unread-count">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ---------- NEW MESSAGE: pick anyone with a profile ---------- */
async function loadPeople(){
  const el = document.getElementById('peopleList');
  const { data, error } = await sb.from('public_profiles').select('id, full_name, name, username, role').neq('id', currentUser.id).limit(100);

  if(error || !data || data.length === 0){
    el.innerHTML = `<div class="empty">No one else has joined yet.</div>`;
    return;
  }

  data.forEach(p => { p.full_name = p.full_name || p.name || p.username || 'Member'; });
  el.innerHTML = data.map(p => {
    const initials = (p.full_name || '?').trim().charAt(0).toUpperCase();
    return `
    <div class="person-card" onclick="openThread('${p.id}', '${escapeHtml(p.full_name || 'Member').replace(/'/g,"\\'")}')">
      <div class="person-avatar">${initials}</div>
      <div>
        <div class="person-name">${escapeHtml(p.full_name || 'Member')}</div>
        <div class="person-role">${escapeHtml(p.role || 'student')}</div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- THREAD ---------- */
async function openThread(otherUserId, otherName){
  activeThreadUserId = otherUserId;
  document.getElementById('inboxView').style.display = 'none';
  document.getElementById('newMsgView').style.display = 'none';
  document.getElementById('threadView').style.display = 'block';
  document.getElementById('threadName').textContent = otherName;

  await loadThread();

  // Mark incoming messages from this person as read
  await sb.from('direct_messages')
    .update({ is_read: true })
    .eq('sender_id', otherUserId)
    .eq('receiver_id', currentUser.id)
    .eq('is_read', false);
}

async function loadThread(){
  const el = document.getElementById('threadMessages');
  const { data, error } = await sb
    .from('direct_messages')
    .select('*')
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeThreadUserId}),and(sender_id.eq.${activeThreadUserId},receiver_id.eq.${currentUser.id})`)
    .order('created_at', { ascending:true });

  if(error){ el.innerHTML = `<div class="empty">Couldn't load this conversation.</div>`; return; }

  if(!data || data.length === 0){
    el.innerHTML = `<div class="empty">Say hello 👋</div>`;
    return;
  }

  el.innerHTML = data.map(m => {
    const mine = m.sender_id === currentUser.id;
    return `<div class="bubble ${mine ? 'me' : 'them'}">${m.audio_path ? `<button type="button" class="vn" data-path="${escapeHtml(m.audio_path)}" onclick="playVoice(this)">▶ Voice message</button>` : escapeHtml(m.body)}<span class="bubble-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}${mine ? ' ' + tickHtml(m) : ''}</span></div>`;
  }).join('');
  el.lastElementChild && el.lastElementChild.scrollIntoView({block:'end'});
}

/* ---------- VOICE NOTES (tap mic to record, tap again to send; max 60s) ---------- */
let rec = null, recChunks = [], recTimer = null;
async function toggleRec(){
  const btn = document.getElementById('micBtn');
  if(rec){ clearTimeout(recTimer); rec.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert('Voice notes are not supported on this browser.'); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ alert('Please allow the microphone to send a voice note.'); return; }
  recChunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove('rec'); btn.textContent = '🎤';
    const type = (rec.mimeType || 'audio/webm').split(';')[0];
    rec = null;
    const blob = new Blob(recChunks, {type});
    if(blob.size < 1500){ return; }
    if(blob.size > 2000000){ alert('That voice note is too long. Keep it under one minute.'); return; }
    await sendVoice(blob, type);
  };
  rec.start();
  btn.classList.add('rec'); btn.textContent = '⏹';
  recTimer = setTimeout(() => { if(rec) rec.stop(); }, 60000);
}
async function sendVoice(blob, type){
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : type.includes('mpeg') ? 'mp3' : 'webm';
  const path = currentUser.id + '/' + activeThreadUserId + '/' + Date.now() + '.' + ext;
  const up = await sb.storage.from('dm-voice').upload(path, blob, {contentType:type});
  if(up.error){ alert('Could not send the voice note: ' + up.error.message); return; }
  const { error } = await sb.from('direct_messages').insert({ sender_id: currentUser.id, receiver_id: activeThreadUserId, body: '🎤 Voice message', audio_path: path });
  if(error){ await sb.storage.from('dm-voice').remove([path]); alert('Error: ' + error.message); return; }
  loadThread();
}
async function playVoice(btn){
  const { data, error } = await sb.storage.from('dm-voice').createSignedUrl(btn.dataset.path, 300);
  if(error || !data){ alert('Could not load this voice note.'); return; }
  const a = new Audio(data.signedUrl); btn.textContent = '⏸ Playing…';
  a.onended = a.onerror = () => { btn.textContent = '▶ Voice message'; };
  a.play().catch(() => { btn.textContent = '▶ Voice message'; });
}

/* ---------- CLASS UPDATES (24h, posted by teachers) ---------- */
async function loadUpdates(){
  const box = document.getElementById('classUpdates');
  try{
    const { data } = await sb.from('class_updates').select('classroom_id, body, created_at').gt('expires_at', new Date().toISOString()).order('created_at', {ascending:false}).limit(10);
    if(!data || !data.length){ box.innerHTML = ''; return; }
    const ids = [...new Set(data.map(u => u.classroom_id))];
    const { data: cls } = await sb.from('classrooms').select('id, name').in('id', ids);
    const nm = {}; (cls || []).forEach(c => nm[c.id] = c.name);
    box.innerHTML = '<div class="sec-title">Class updates</div>' + data.map(u => `<div class="upd"><b data-no-i18n>${escapeHtml(nm[u.classroom_id] || '')} · ${shortTime(u.created_at)}</b><div data-no-i18n>${escapeHtml(u.body)}</div></div>`).join('');
  }catch(e){ box.innerHTML = ''; }
}

async function sendMessage(){
  const input = document.getElementById('composeInput');
  const body = input.value.trim();
  if(!body) return;

  const { error } = await sb.from('direct_messages').insert({
    sender_id: currentUser.id,
    receiver_id: activeThreadUserId,
    body
  });

  if(error){ alert('Error: ' + error.message); return; }
  input.value = '';
  loadThread();
}

initAuth();
</script>
<script src="js/msgtabs.js" defer></script>
<script src="js/nav.js" defer></script>
</body>
</html>
