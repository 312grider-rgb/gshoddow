<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Challenges — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/incentives.js"></script>
<style>
  :root{
    --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --gold-light:#E4C583;
    --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2;
    --shadow-soft:0 2px 10px rgba(20,31,56,0.06);
    --shadow-card:0 8px 24px rgba(20,31,56,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); -webkit-font-smoothing:antialiased; padding-bottom:30px;}
  h1,h2,h3{font-family:'Syne',sans-serif;}
  a{text-decoration:none;}

  header.top{background:linear-gradient(160deg, rgba(20,31,56,0.88) 0%, rgba(31,46,82,0.88) 100%); color:var(--cream); padding:22px 18px 28px;}
  header.top .eyebrow{font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-light); margin-bottom:4px; font-weight:700;}
  header.top h1{margin:0; font-size:23px;}
  header.top p{margin:6px 0 0; font-size:13.5px; opacity:0.85;}

  .wrap{padding:18px;}
  .section-title{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); font-weight:700; margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .loading{text-align:center; padding:30px; color:#888;}
  .empty{background:#fff; border:1px dashed var(--line); border-radius:14px; padding:22px 16px; text-align:center; color:#777; font-size:13.5px;}

  .challenge-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow-soft);}
  .challenge-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .challenge-title{font-family:'Syne',sans-serif; font-weight:700; color:var(--ink); font-size:15.5px;}
  .difficulty{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .difficulty.easy{background:#EAF0EC; color:var(--sage);}
  .difficulty.normal{background:#F5EAD6; color:var(--gold);}
  .difficulty.hard{background:#F6E3DE; color:#c0523a;}
  .challenge-desc{font-size:13.5px; color:#5c5648; line-height:1.55; margin-bottom:12px;}

  .challenge-status{font-size:12px; font-weight:700; margin-bottom:10px;}
  .challenge-status.completed{color:var(--sage);}
  .challenge-status.in_progress{color:var(--gold);}

  textarea.response-box{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:13.5px; min-height:70px; resize:vertical; margin-bottom:10px;
  }
  textarea.response-box:focus{outline:none; border-color:var(--gold-light);}

  .challenge-actions{display:flex; gap:8px;}
  .btn-primary{background:var(--ink); color:#fff; border:none; padding:10px 14px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-secondary{background:#fff; border:1.5px solid var(--line); color:var(--ink); padding:10px 14px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;}

  footer.site-footer{margin-top:30px; text-align:center; font-size:12.5px; color:#948f80;}
  footer.site-footer a{color:var(--ink); font-weight:600;}

  .create-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px;}
  .create-card label{display:block; font-size:13px; font-weight:600; margin:10px 0 5px; color:var(--ink);}
  .create-card label:first-child{margin-top:0;}
  .create-card select, .create-card input, .create-card textarea{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px;
    font-family:inherit; font-size:13.5px; background:#fff;
  }
  .create-card textarea{min-height:64px; resize:vertical;}
  .create-toggle{
    background:#fff; border:1.5px solid var(--line); color:var(--ink); padding:10px 14px;
    border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:14px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Learning Never Ends</div>
  <h1>🎯 Learning Challenges</h1>
  <p>Short, meaningful ways to apply what you're learning — not busywork.</p>
</header>

<div class="wrap">
  <button class="create-toggle" id="createToggleBtn" style="display:none;" onclick="toggleCreateForm()">+ Create a Challenge</button>
  <div class="create-card" id="createCard" style="display:none;">
    <label>Type</label>
    <select id="newType">
      <option value="daily">Daily Challenge</option>
      <option value="weekly">Weekly Challenge</option>
      <option value="skill">Skill Challenge</option>
      <option value="project">Real-World Project</option>
    </select>
    <label>Title</label>
    <input type="text" id="newTitle" placeholder="e.g. Explain your favorite concept from this week">
    <label>Description</label>
    <textarea id="newDescription" placeholder="What should the learner actually do?"></textarea>
    <label>Difficulty</label>
    <select id="newDifficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn-primary" style="margin-top:12px;" onclick="createChallenge()">Publish Challenge</button>
  </div>

  <div id="challengeList"><div class="loading">Loading challenges…</div></div>

  <footer class="site-footer">
    <a href="skillstream-dashboard.html">&larr; Back to Dashboard</a>
  </footer>
</div>

<script>
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  currentUser = session.user;

  const { data: profile } = await sb.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
  if(profile?.role === 'teacher'){
    document.getElementById('createToggleBtn').style.display = 'block';
  }

  loadChallenges();
}

function toggleCreateForm(){
  const card = document.getElementById('createCard');
  card.style.display = card.style.display === 'none' ? 'block' : 'none';
}

async function createChallenge(){
  const type = document.getElementById('newType').value;
  const title = document.getElementById('newTitle').value.trim();
  const description = document.getElementById('newDescription').value.trim();
  const difficulty = document.getElementById('newDifficulty').value;

  if(!title || !description){ alert('Give it a title and a description first.'); return; }

  const { error } = await sb.from('challenges').insert({
    type, title, description, difficulty, created_by: currentUser.id
  });
  if(error){ alert('Error: ' + error.message); return; }

  document.getElementById('newTitle').value = '';
  document.getElementById('newDescription').value = '';
  toggleCreateForm();
  loadChallenges();
}

async function loadChallenges(){
  const el = document.getElementById('challengeList');

  const [{ data: challenges, error }, { data: progress }] = await Promise.all([
    sb.from('challenges').select('*').order('created_at'),
    sb.from('challenge_progress').select('*').eq('user_id', currentUser.id)
  ]);

  if(error){
    el.innerHTML = `<div class="empty">Couldn't load challenges.<br><small>${escapeHtml(error.message)}</small></div>`;
    return;
  }
  if(!challenges || challenges.length === 0){
    el.innerHTML = `<div class="empty">No challenges yet — check back soon.</div>`;
    return;
  }

  const progressByChallenge = {};
  (progress || []).forEach(p => { progressByChallenge[p.challenge_id] = p; });

  const groups = { daily: [], weekly: [], skill: [], project: [] };
  challenges.forEach(c => { (groups[c.type] || (groups[c.type] = [])).push(c); });

  const labels = { daily: 'Daily Challenge', weekly: 'Weekly Challenge', skill: 'Skill Challenge', project: 'Real-World Project' };

  el.innerHTML = Object.keys(labels).filter(k => groups[k] && groups[k].length).map(type => `
    <div class="section-title">${labels[type]}</div>
    ${groups[type].map(c => renderChallengeCard(c, progressByChallenge[c.id])).join('')}
  `).join('');
}

function renderChallengeCard(c, prog){
  const status = prog ? prog.status : null;
  const response = prog?.response || '';
  return `
    <div class="challenge-card">
      <div class="challenge-top">
        <div class="challenge-title">${escapeHtml(c.title)}</div>
        <span class="difficulty ${escapeHtml(c.difficulty || 'normal')}">${escapeHtml(c.difficulty || 'normal')}</span>
      </div>
      <div class="challenge-desc">${escapeHtml(c.description)}</div>
      ${status === 'completed'
        ? `<div class="challenge-status completed">✓ Completed</div>${response ? `<div class="challenge-desc">${escapeHtml(response)}</div>` : ''}`
        : `
          <div class="challenge-status in_progress">${status === 'in_progress' ? 'In progress' : 'Not started'}</div>
          <textarea class="response-box" id="resp-${c.id}" placeholder="Write your answer, explanation, or a link to what you built...">${escapeHtml(response)}</textarea>
          <div class="challenge-actions">
            <button class="btn-secondary" onclick="saveProgress('${c.id}', 'in_progress')">Save Progress</button>
            <button class="btn-primary" onclick="saveProgress('${c.id}', 'completed')">Mark Complete</button>
          </div>
        `}
    </div>
  `;
}

async function saveProgress(challengeId, status){
  const textarea = document.getElementById(`resp-${challengeId}`);
  const response = textarea ? textarea.value.trim() : null;

  const { error } = await sb.from('challenge_progress').upsert({
    user_id: currentUser.id,
    challenge_id: challengeId,
    status,
    response,
    completed_at: status === 'completed' ? new Date().toISOString() : null
  }, { onConflict: 'user_id,challenge_id' });

  if(error){ alert('Error: ' + error.message); return; }

  await loadChallenges();

  if(status === 'completed' && window.Incentives){
    Incentives.showToasts(await Incentives.checkAchievements(sb));
  }
}

initAuth();
</script>
<script src="js/nav.js" defer></script>
</body>
</html>
