<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Assistant — Paradise Of The Eternal Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/lne-helpers.js?v=1"></script>
<style>
  :root{ --ink:#141F38; --ink-2:#1F2E52; --gold:#C9A24E; --cream:#FBF7EF; --sage:#6B8F71; --charcoal:#2B2B2B; --line:#E9E2D2; --danger:#B5533C; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal); padding-bottom:60px;}
  h1,h2,h3{font-family:'Fraunces',serif;}
  header.top{background:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 100%); color:var(--cream); padding:22px 18px 26px;}
  header.top .eyebrow{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:4px; font-weight:700;}
  header.top h1{margin:0; font-size:24px;}
  header.top a{color:var(--gold); font-size:13px; text-decoration:none; display:inline-block; margin-top:8px;}
  .wrap{padding:18px; max-width:760px; margin:0 auto;}
  .note{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:13px; color:#555; margin-bottom:16px; line-height:1.5;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .chip{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:8px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;}
  .chip:active{transform:scale(.97);}
  textarea{width:100%; min-height:84px; border:1.5px solid var(--line); border-radius:12px; padding:12px; font:inherit; font-size:15px; resize:vertical; background:#fff;}
  .btn{background:var(--ink); color:#fff; border:0; border-radius:12px; padding:13px 18px; font-weight:700; font-size:15px; cursor:pointer; width:100%; margin-top:10px;}
  .btn:disabled{opacity:.55;}
  .answer{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; line-height:1.6; font-size:15px; white-space:pre-wrap; word-wrap:break-word;}
  .answer.err{border-color:var(--danger); color:var(--danger);}
  .answer code{background:#F3EEE0; padding:1px 5px; border-radius:5px; font-size:13px;}
  details{margin-top:14px; font-size:12.5px; color:#666;}
  details pre{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; overflow:auto; max-height:300px; font-size:12px;}
  #lockedView,#adminView{display:none;}
  .locked{text-align:center; padding:40px 10px;}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Admin</div>
  <h1>AI Assistant</h1>
  <a href="skillstream-admin.html">&larr; Back to Admin</a>
</header>

<div class="wrap">
  <div id="loadingView">Loading…</div>

  <div id="lockedView" class="locked">
    <h2>Admins only</h2>
    <p>This page is only for administrators.</p>
    <a href="skillstream-home.html">Go home</a>
  </div>

  <div id="adminView">
    <div class="note">
      I read a <b>counts-only summary</b> of the app (no emails, names or messages) and answer from it.
      I can <b>only read and suggest</b>: I never change data or code. You approve every change.
    </div>

    <div class="chips" id="chips">
      <button class="chip" type="button">Give me a health check of the app</button>
      <button class="chip" type="button">How is AI being used? Any cost risk?</button>
      <button class="chip" type="button">What should I fix or build next?</button>
      <button class="chip" type="button">Are the plan limits set sensibly?</button>
    </div>

    <textarea id="q" maxlength="1500" placeholder="Ask about usage, signups, plans, or what to improve…"></textarea>
    <button class="btn" id="askBtn" type="button">Ask</button>

    <div id="answer"></div>
    <details id="dataBox" style="display:none">
      <summary>Data I used</summary>
      <pre id="dataPre"></pre>
    </details>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vauudtedojtcveiqajlr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mKrbrP7s7BLQgb6u0IQ8xg_wn--izVE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'skillstream-login.html'; return; }
  const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
  document.getElementById('loadingView').style.display = 'none';
  if(!profile || profile.role !== 'admin'){
    document.getElementById('lockedView').style.display = 'block';
    return;
  }
  document.getElementById('adminView').style.display = 'block';
}

// Safe mini-markdown: everything is HTML-escaped FIRST, then only **bold**, *italic*, `code` are added.
function render(t){
  var e = String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  e = e.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,:;!?]|$)/g,'$1<em>$2</em>')
       .replace(/`([^`\n]+)`/g,'<code>$1</code>');
  return e;
}

function show(text, isErr){
  const box = document.getElementById('answer');
  box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'answer' + (isErr ? ' err' : '');
  if(isErr){ d.textContent = text; }
  else { d.innerHTML = render(text); }
  box.appendChild(d);
}

async function ask(){
  const q = document.getElementById('q').value.trim();
  if(!q){ show('Please type a question first.', true); return; }
  const btn = document.getElementById('askBtn');
  btn.disabled = true; btn.textContent = 'Thinking…';
  try{
    const headers = await window.aiHeaders(sb);
    const res = await fetch('/api/admin-assistant', { method:'POST', headers, body: JSON.stringify({ question: q }) });
    let data = {};
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){ show(data.error || 'Something went wrong. Please try again.', true); return; }
    show(data.text, false);
    if(data.snapshot){
      document.getElementById('dataPre').textContent = JSON.stringify(data.snapshot, null, 2);
      document.getElementById('dataBox').style.display = 'block';
    }
  }catch(e){
    show('Could not reach the server. Check your connection.', true);
  }finally{
    btn.disabled = false; btn.textContent = 'Ask';
  }
}

document.getElementById('askBtn').addEventListener('click', ask);
document.querySelectorAll('#chips .chip').forEach(function(c){
  c.addEventListener('click', function(){ document.getElementById('q').value = c.textContent; ask(); });
});
init();
</script>
</body>
</html>
